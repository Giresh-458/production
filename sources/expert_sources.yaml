  global_scholarly_apis:
  - name: OpenAlex Authors
    type: api_directory
    url: https://api.openalex.org/authors
    query_template: https://api.openalex.org/authors?search={query}&per-page=5
    focus: author discovery, affiliations, works, concepts
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
  - name: Semantic Scholar Author Search
    type: api_directory
    url: https://api.semanticscholar.org/graph/v1/author/search
    query_template: https://api.semanticscholar.org/graph/v1/author/search?query={query}&limit=5&fields=name,affiliations,paperCount,citationCount,homepage
    focus: author search, papers, citation activity, affiliations
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
  manual_profile_directories:
  - name: Google Scholar Profiles
    type: profile_directory_manual
    url: https://scholar.google.com/
    auto_collect: false
    focus: manual profile validation, citation tracking, alerts
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
  - name: ORCID
    type: profile_directory_manual
    url: https://orcid.org/
    auto_collect: false
    focus: manual researcher identity validation, affiliations, public works
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
  - name: ResearchGate
    type: profile_directory_manual
    url: https://www.researchgate.net/
    auto_collect: false
    focus: manual profile discovery, topic overlap, publication discovery
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
  - name: DBLP
    type: profile_directory_manual
    url: https://dblp.org/
    auto_collect: false
    focus: manual computer science bibliography validation and author lookup
    limits:
      max_pages: 12
      max_depth: 2
      max_seconds: 120
