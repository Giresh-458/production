  - name: Open SBIR Funding Topics
    research_domains: [RWA, ESG, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://www.sbir.gov/topics?status=Open
    focus: Broad official SBIR.gov discovery portal for open and forthcoming topics across agencies. This is a discovery hub, not proof every listed opportunity is currently accepting applications; validate each topic's status, next due date, U.S. small-business eligibility and direct RIF-domain evidence. Exclude historical awards, generic application guidance and unrelated community pages.
    collection:
      mode: web
      engine: crawl4ai
      # Crawl SBIR.gov topic listings only. Official agency solicitations
      # are verified separately from each topic's explicit official link.
      allowed_domains:
      - sbir.gov
      - www.sbir.gov
      - nsf.gov
      - www.nsf.gov
      discovery:
        start_urls:
        - https://www.sbir.gov/topics?status=Open
        max_depth: 5
        max_pages: 120
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
        # Official NSF 26-510 is fetched by the per-topic verification helper, not emitted
        # as a second generic "Program Solicitation" opportunity from this discovery crawl.
        - '^https?://(?:www[.])?nsf[.]gov/funding/opportunities/small-business-innovation-research-small-business-technology/nsf26-510/solicitation(?:[?#].*)?$'
        # Other NSF navigation and procedure pages are not individual funding calls.
        - '^https?://(?:www[.])?nsf[.]gov/(?:funding/(?:preparing-proposal|submitting-proposal|merit-review)|policies/|awards(?:/|$))'
        - '^https?://seedfund[.]nsf[.]gov/solicitation-(?:merit-review|post-award|eligibility|proposal|project-description|budget|documents)(?:/|[?#]|$)'
        # Historical TABA supplement and generic SBIR eligibility guidance are not open calls.
        - '^https?://(?:www[.])?nsf[.]gov/funding/opportunities/dcl-technical-business-assistance-taba-supplement-active-small/nsf22-063(?:/|[?#]|$)'
        - '^https?://(?:www[.])?sbir[.]gov/sites/default/files/elig_size_compliance_guide[.]pdf(?:[?#].*)?$'
        - '^https?://(?:www[.])?sbir[.]gov/javascript[.]void'
        - '^https?://(?:www[.])?sbir[.]gov/awards(?:/|[?#]|$)'
        - '^https?://(?:www[.])?sbir[.]gov/apply(?:/|[?#]|$)'
        - '^https?://(?:www[.])?sbir[.]gov/community/gafc(?:/|[?#]|$)'
        - '^https?://data[.]www[.]sbir[.]gov/'
        - '^https?://(?:www[.])?grants[.]gov/grantors/grantor-help(?:/|[?#]|$)'
        # Generic Grants.gov help/navigation pages are not SBIR topics.
        - '^https?://(?:www[.])?grants[.]gov/(?:help/)?(?:learn-grants|search-grants|applicants|grantors|system-to-system|forms|support)(?:[.]html)?(?:/|[?#]|$)'
        # The legacy Grants.gov apply portal emits generic navigation links, not SBIR topics.
        - '^https?://apply[0-9]+[.]grants[.]gov/apply/(?:spoExit[.]jsp|login[.]faces|javax[.]faces[.]resource)(?:[/?#].*)?$'
        # Generic Grants.gov root links from the legacy login portal are navigation, not SBIR topics.
        - '^https?://(?:www[.])?grants[.]gov/?(?:[?#].*)?$'
        # Allow the specific current NSF 26-510 solicitation linked by SBIR topic records,
        # while excluding unrelated NSF navigation from this bounded discovery source.
        - '^https?://(?:www[.])?nsf[.]gov/(?!funding/opportunities/.+/solicitation(?:[?#]|$))'
        # The broad NSF opportunity index is not the SBIR topic feed and is blocked by anti-bot protection.
        - '^https?://(?:www[.])?nsf[.]gov/funding/opportunities/?(?:[?#].*)?$'
        # Exclude generic NSF audience/admin hubs, but preserve individual SBIR/STTR solicitations.
