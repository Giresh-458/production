sources:
  tier_1:
  - name: Ethereum ESP RFPs
    url: https://esp.ethereum.foundation/applicants/rfp
    focus: current Ethereum requests for proposals, research, security, cryptography,
      protocol, academic and ecosystem infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum ESP Open Rounds
    url: https://esp.ethereum.foundation/applicants/open-rounds
    focus: active Ethereum grant rounds and time-limited funding opportunities
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/open-rounds
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum Road to Devcon 8 India University Program
    url: https://esp.ethereum.foundation/applicants/rfp/rtd8_india_academic
    focus: India universities, faculty, academic engagement, Ethereum research and
      education
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp/rtd8_india_academic
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum Foundation ESP
    url: https://esp.ethereum.foundation/applicants
    focus: protocol research, identity, zero-knowledge, public goods, security, infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Chainlink Grants
    url: https://chain.link/community/grants
    direct_page: true
    focus: oracles, RWA, proof of reserve, data feeds, cross-chain, stablecoins
    collection:
      mode: url_validation
  - name: Polygon Grants
    url: https://polygon.technology/village/startups
    focus: zero-knowledge, RWA, identity, scalability, consumer applications
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - polygon.technology
      - hadronfc.com
      discovery:
        start_urls:
        - https://polygon.technology/village/startups
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Solana Grants and Funding
    url: https://solana.org/grants-funding
    focus: payments, stablecoins, DePIN, high-performance infrastructure, consumer
      apps
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - solana.org
      - solana.com
      - earn.superteam.fun
      discovery:
        start_urls:
        - https://solana.org/grants-funding
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  tier_2:
  - name: NEAR Funding
    url: https://www.near.org/funding
