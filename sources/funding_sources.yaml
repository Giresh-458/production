# Canonical research domains: RWA, ESG, ZK-IoV, DID, DePIN, MEV, and Stablecoins. Each discovered call must independently match source evidence.
sources:
  tier_1:
  - name: Ethereum ESP RFPs
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/rfp
    focus: current Ethereum requests for proposals, research, security, cryptography,
      protocol, academic and ecosystem infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum ESP Open Rounds
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/open-rounds
    focus: active Ethereum grant rounds and time-limited funding opportunities
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/open-rounds
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Solana Grants and Funding
    research_domains: [RWA, DePIN, MEV, Stablecoins]
    url: https://solana.org/grants-funding
    direct_page: false
    focus: payments, stablecoins, DePIN, high-performance infrastructure, consumer
      apps
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - solana.org
      - solana.com
      - airtable.com
      # Crawl the public RFP table and official pages; exclude forms and Superteam's
      # directory below because Superteam is separately configured.
      discovery:
        start_urls:
        - https://solana.org/grants-funding
        max_depth: 3
        max_pages: 30
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://(?:www\.)?share\.hsforms\.com/'
          - '^https?://earn\.superteam\.fun/grants(?:/|\?|$)'
          - '^https?://solana\.com/news/'
          # These shared views are placeholder tables / application destinations, not call detail pages.
          - '^https?://airtable[.]com/apppDmK2Pin9WX8jV/shrDbfJ1wktQ7pB6f(?:/|[?#]|$)'
          - '^https?://airtable[.]com/apppDmK2Pin9WX8jV/shrolVvhFsrwvq3rA(?:/|[?#]|$)'
  - name: Superteam Development Grants
    research_domains: [RWA, DePIN, MEV, Stablecoins]
    url: https://superteam.fun/earn/opportunities/development-grants/
    focus: Official Superteam Earn development-grants directory for Solana and web3 builders. Treat this as a discovery hub, not proof that every listed opportunity is a current cash grant; verify each listing's status, funding or prize terms, eligibility and application instructions.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - superteam.fun
      - earn.superteam.fun
      - solana.org
      - solana.foundation
      - solana.com
      - airtable.com
      - share.hsforms.com
      - typeform.com
      discovery:
        start_urls:
        - https://superteam.fun/earn/opportunities/development-grants/
        max_depth: 3
        max_pages: 70
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          # Token thumbnails are decorative API assets, not call pages. Do not let
          # anti-bot responses for icons mark otherwise complete discovery PARTIAL.
          - '^https?://superteam[.]fun/api/token-icon(?:[/?#].*)?'
          # Google Docs, forms, and database views are application/support routes,
          # not separate funding-call detail pages.
          - '^https?://docs\.google\.com/document/'
          - '^https?://[^/]*typeform\.com/'
          - '^https?://share\.hsforms\.com/'
          - '^https?://airtable\.com/'
          # Announcement articles are not individual funding calls.
          - '^https?://(?:www\.)?solana\.com/news/'
  tier_2:
  - name: NEAR Ecosystem Funding
    research_domains: [RWA, DID, DePIN, MEV, Stablecoins]
    url: https://near.org/funding
    focus: Official NEAR ecosystem grants; retain individual opportunities only when the call has direct evidence for RWA, DID, DePIN, MEV or stablecoins, with current status verified.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - near.org
      - www.near.org
      - devhub.near.org
      - nearprotocolrewards.com
      - www.nearprotocolrewards.com
      - hzn.xyz
      - www.hzn.xyz
      - airtable.com
      - near-foundation.notion.site
      - nearn.io
      - docs.metapool.app
      - potlock.org
      - app.potlock.org
      discovery:
        start_urls:
        - https://near.org/funding
        - https://www.near.org/founder-hub
        - https://www.nearprotocolrewards.com/
        - https://www.hzn.xyz/
        - https://nearn.io/devhub/
        - https://app.potlock.org/campaigns
        - https://app.potlock.org/pots
        # These two official publisher pages have explicit current application CTAs;
        # force their page classification instead of relying on link-anchor heuristics.
        direct_page_urls:
        - https://www.nearprotocolrewards.com/
        - https://www.hzn.xyz/
        # Explicit portal roots allow shallow traversal to current individual calls.
        max_depth: 3
        # Leave room for current opportunities while excluding non-call social/docs links.
        max_pages: 40
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        # Avoid duplicate rendered Markdown mirrors and irrelevant Meta Pool governance pages.
        exclude_url_patterns:
          # NEAR's social-media amplification form is not a funding application.
          - '^https?://near-foundation[.]notion[.]site/1d0da22d7b6480e6a423cd2681fd8a00(?:[/?#].*)?$'
          - '^https?://(?:www\.)?x\.com/'
          - '^https?://(?:www\.)?linkedin\.com/'
          - '^https?://(?:www\.)?t\.me/'
          - '^https?://github\.com/NEAR-DevHub(?:/|$)'
          - '^https?://docs\.potlock\.io/user-guides/campaigns(?:/|$)'
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/as-validator(?:/|$)'
          - '^https?://docs\.metapool\.app/master/.*\.md(?:[?#].*)?$'
          - '^https?://docs\.metapool\.app/master/tokenomics-and-governance/'
          - '^https?://docs\.metapool\.app/master/meta-pool-ecosystem/vote-governance/(?!grants/?$)'
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/bug-bounty-program(?:/|$)'
          # This is explicitly RPGF Round #1 with registration in November-December 2024;
          # it is historical evidence, not a current funding opportunity.
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/retroactive-public-goods-funding-rpgf(?:/|[?#]|$)'
          - '^https?://app\.potlock\.org/campaign/\d+\?tab=(?:leaderboard|settings)(?:&|$)'
          # Rendered template placeholders are not real Potlock campaigns.
          - '^https?://app\.potlock\.org/campaign/[^?]*campaignId[^?]*(?:\?|$)'
          - '^https?://app\.potlock\.org/campaign/?(?:\?.*)?$'
          # This is an application form destination, not a separate opportunity detail page.
          - '^https?://airtable[.]com/appc0ZVhbKj8hMLvH/pagVX3hSxzIj4Y680/form(?:[/?#].*)?$'
          # The current Protocol Rewards CTA links to this Airtable submission form.
          - '^https?://airtable[.]com/appFoIqAoY0ikoVIb/shr4u30KcGeNJwhKu(?:[/?#].*)?$'
  - name: Ripple UBRI
    research_domains: [RWA, DID, Stablecoins]
    url: https://ripple.com/impact/ubri/
    direct_page: true
    focus: Official Ripple UBRI page with the current UDAX 2027 application CTA. Treat UBRI research highlights as historical context; only emit a current opportunity when the page carries the explicit UDAX 2027 apply CTA and current status evidence.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - ripple.com
      discovery:
        start_urls:
        - https://ripple.com/impact/ubri/
        currentness_verification_urls:
        - https://ripple.com/impact/ubri/
        max_depth: 2
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
        - '^https?://(?:www\.)?ripple\.com/reports/Ripple-UBRI-Research-20\d{2}\.pdf(?:[?#].*)?$'
        - '^https?://docs\.google\.com/forms/'
  - name: XRPL Grants Program
    research_domains: [RWA, Stablecoins]
    url: https://xrplgrants.org/
    focus: Official XRPL grants directory for RWA/tokenization and stablecoin/payment infrastructure. Crawl the application manager as well as the directory; it can state that no applications are currently open. Require current call-specific evidence before accepting an opportunity.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - xrplgrants.org
      - submit.xrplgrants.org
      - brinc.io
      - tenity.com
      - airtable.com
      discovery:
        start_urls:
        - https://xrplgrants.org/
        - https://submit.xrplgrants.org/submit
        max_depth: 3
        max_pages: 24
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://xrplgrants[.]org/(?:awardees|accelerator|about|faq|judges)'
          - '^https?://airtable\.com/'
          # Investor/news articles are not XRPL funding opportunities.
          - '^https?://(?:www\.)?tenity\.com/(?:keyrock-reaches|tenity-joins|tenity-backs|tenity-invests-in)[^/]*'
          # Submittable's generic powered-by landing page is vendor navigation, not a funding call.
          - '^https?://(?:www[.])?submittable[.]com/what-is-submittable/'
          - '^https?://manager[.]submittable[.]com/user/submissions(?:[/?#].*)?$'
  - name: Filecoin Grants and Funding
    research_domains: [DePIN]
    url: https://fil.org/grants
    direct_page: false
    focus: Official Filecoin Foundation grants directory plus authoritative programme descriptions for Open Grants and FIL Builder Next Step Grants. The directory is a discovery hub; use the seeded programme pages as direct evidence and do not treat historical applicant issues as separate funding calls.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - raw.githubusercontent.com
      - github.com
      - fil.org
      - www.fil.org
      discovery:
        # The foundation directory has returned HTTP 429 for robots.txt. Respect
        # that access signal and verify against the official Filecoin-maintained
        # programme documents instead of retrying the blocked directory.
        start_urls:
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        # Official Filecoin Foundation grants page links to this separate builder programme.
        # Seed its authoritative programme description because fil.org/grants is rate-limited
        # at robots.txt in some runs; this does not bypass that site's access policy.
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Builder%20Next%20Step%20Grants.md
        currentness_verification_urls:
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Builder%20Next%20Step%20Grants.md
        max_depth: 3
        max_pages: 30
        # The root URL is a directory. Force-record only official programme
        # descriptions; selection still requires source-backed status, eligibility,
        # and domain evidence.
        direct_page_urls:
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Builder%20Next%20Step%20Grants.md
        follow_detail_pages: true
        follow_pdfs: true
        pagination: false
        exclude_url_patterns:
          # GitHub issue history is not current Filecoin Foundation programme detail content.
          - '^https?://github\.com/filecoin-project/devgrants/(?:issues|milestones|labels)(?:/|[?#]|$)'
          # The separate IPFS devgrants repository and IPFS Implementation Fund are outside Filecoin Foundation scope.
          - '^https?://github\.com/ipfs/devgrants(?:/|[?#]|$)'
          - '^https?://(?:www\.)?ipfsgrants\.io(?:/|[?#]|$)'
  - name: Flashbots MEV Research Grants
    research_domains: [MEV]
    url: https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
    direct_page: true
    focus: Official Flashbots MEV fellowship grants for research proposals on MEV topics; verify current availability, deliverables and applicant requirements from the current page.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - github.com
      - raw.githubusercontent.com
      # The grants.md file can retain historical rolling-application wording.
      # Cross-check the repository's current official status before marking it open.
      status_verification_urls:
      - https://raw.githubusercontent.com/flashbots/mev-research/main/README.md
      discovery:
        start_urls:
        - https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  tier_3:
  - name: Climate KIC Open Calls
    research_domains: [ESG]
    url: https://www.climate-kic.org/get-involved/open-calls/
    focus: Official climate-innovation open-call directory. Some entries are accelerators, expressions of interest, or support programmes rather than grants; retain only individual calls with explicit funding/application evidence and direct ESG relevance.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - assets.eitfood.eu
      - eit-culture-creativity.eu
      - eitcc-dev.wmstudio.space
      - eit-girlsgostem.eu
      - apply.eithealth.eu
      - climate-kic.org
      - www.climate-kic.org
      - neb.eitcommunity.eu
      - eit-hei.eu
      - womentecheurope.eu
      - cascadefunding.sploro.eu
      - bioeconomygiants.com
      - foodbiocluster.dk
      - www.foodbiocluster.dk
      - podio.com
      - inonext-project.eu
      - www.inonext-project.eu
      - climatechconnect.eu
      - new-european-bauhaus.europa.eu
      - 6740820.app.netsuite.com
      - seedbook.eitrawmaterials.eu
      - www.jetro.go.jp
      - opencalls.fund
      - www.eitfood.eu
      - climatelaunchpad.org
      - www.circlethemed.com
      - cleancities-accelerator.com
      - pcp-wise.eu
      - www.pathways2resilience.eu
      - www.eiturbanmobility.eu
      - eit.europa.eu
      - ec.europa.eu
      - neb.awardsplatform.com
      - neb-catalyse.awardsplatform.com
      - seedbook-portal.eitrawmaterials.eu
      - www.kcicconsulting.com
      - blackseaclimaccelerator.eu
      - www.impacthub.ro
      - accelerator.bg
      - cdr-accelerator.com
      - www.bgi.pt
      - medclimaccelerator.com
      - sell.amazon.co.uk
      - www.eit-circulareconomy.eu
      - www.cleancities.network
      related_context_pages:
      - primary_url: https://www.eiturbanmobility.eu/call-for-proposals/sme-market-expansion-open-call-2027/
        context_url: https://www.eiturbanmobility.eu/sme-market-expansion-open-call-2027/
        fields: [eligibility]
      discovery:
        start_urls:
        # The directory was checked for current calls, but its index fans out to 112 closed calls.
        # Pin this batch to the current official call pages below to avoid false coverage gaps.
        - https://www.climate-kic.org/open-call/enhance-neb-2027-open-call/
        - https://www.climate-kic.org/open-call/desirmed-climate-ambassador/
        - https://www.climate-kic.org/open-call/eit-higher-education-initiative-eit-hei-2026/
        - https://womentecheurope.eu/active-calls/
        # This 2027 EIT Urban Mobility call is current but was linked only from a
        # historical news page in the previous crawl. Seed its canonical detail
        # page so depth reached from the old news page cannot hide the live call.
        - https://www.eiturbanmobility.eu/call-for-proposals/sme-market-expansion-open-call-2027/
        # Official companion announcement contains additional eligibility criteria
        # (minimum three FTE and TRL 7+) omitted from the call-detail page.
        - https://www.eiturbanmobility.eu/sme-market-expansion-open-call-2027/
        direct_page_urls:
        - https://www.climate-kic.org/open-call/enhance-neb-2027-open-call/
        - https://www.climate-kic.org/open-call/desirmed-climate-ambassador/
        - https://www.climate-kic.org/open-call/eit-higher-education-initiative-eit-hei-2026/
        - https://www.eiturbanmobility.eu/call-for-proposals/sme-market-expansion-open-call-2027/
        - https://www.eiturbanmobility.eu/sme-market-expansion-open-call-2027/
        # One extra level fetches current-call attachments linked from official
        # partner detail pages; max_pages remains a hard cap against crawl fan-out.
        # The official index separates live calls from its large closed-call archive.
        # One detail-page level preserves current-call discovery without recursively
        # fetching years of obsolete attachments and third-party application portals.
        max_depth: 3
        max_pages: 100
        exclude_url_patterns:
          # The directory separates four live Climate KIC calls from a large closed-call archive.
          # Keep current call pages and seeded partner programmes; do not fan out through historical detail pages.
          - '^https?://www[.]climate-kic[.]org/open-call/(?!enhance-neb-2027-open-call(?:/|[?#]|$)|desirmed-climate-ambassador(?:/|[?#]|$)|eit-higher-education-initiative-eit-hei-2026(?:/|[?#]|$)|women-techeu-2-eic(?:/|[?#]|$))'
          # These historical announcements are not canonical call pages; current call details are seeded above.
          - '^https?://www[.]eiturbanmobility[.]eu/launch-of-cross-kic-new-european-bauhaus-call-for-proposals-for-citizen-engagement/(?:[?#].*)?$'
          - '^https?://www[.]eiturbanmobility[.]eu/launch-of-cross-kic-new-european-bauhaus-call-for-regions-cities-or-affiliated-entities-capitalising-on-existing-public-realm-solutions/(?:[?#].*)?$'
          # The EIT-HEI partner route is blocked by Cloudflare, but its current call is
          # represented by the directly seeded official Climate KIC call page above.
          - '^https?://(?:www[.])?eit-hei[.]eu/funding-support/funding-opportunities/open-calls/call-for-proposals-2026/?(?:[?#].*)?$'
          # EIT Culture & Creativity opportunities are creative-sector calls, not the
          # climate/ESG scope of this source; do not let their collateral contaminate it.
          - '^https?://eit-culture-creativity[.]eu/your-opportunities/calls-funding/(?:financial-support-startups-and-scaleups-shape-acceleration-scale|new-ventures-creative-tech-spark-incubation|innovation-projects|skills-based-cpd-courses)(?:/|[?#]|$)'
          - '^https?://eit-culture-creativity[.]eu/sites/default/files/2026-(?:06|09|10)/.*(?:EITCC|Open%20Call|Application|CPD|Innovation|Eligibility|Financial%20support).*[.](?:pdf|docx?)(?:[?#].*)?$'
          - '^https?://eitcc-dev[.]wmstudio[.]space/sites/default/files/2026-(?:07|08|10)/.*(?:EITCC|CPD|Eligibility).*[.](?:pdf|docx?)(?:[?#].*)?$'
          # A confirmed 404 supporting attachment is not a live call or coverage root.
          - '^https?://eit-culture-creativity[.]eu/sites/default/files/2026/10/Financial%20support%20to%20Startups%20and%20Scaleups_7[.]10[.]2026[.]pdf(?:[?#].*)?$'
          # This NetSuite PDF is an eligibility appendix, not a separate opportunity record.
          - '^https?://6740820[.]app[.]netsuite[.]com/core/media/media[.]nl[?]id=711659(?:&|$)'
          # Retired partner URLs now return 404; current official programme/call
          # pages are seeded above so stale aliases do not masquerade as missed coverage.
          - '^https?://eit-culture-creativity[.]eu/open-call-acceleration-and-post-acceleration-programmes/?(?:[?#].*)?$'
          - '^https?://(?:www[.])?eitfood[.]eu/open-calls/fast-track-to-market(?:-2024)?/?(?:[?#].*)?$'
          # These are unrelated external articles/pages exposed by pagination detection,
          # not funding-call pagination or official call-detail pages.
          - '^https?://www[.]desirmed[.]eu/announcements/desirmed-launches-a-photo-contest-capture-climate-adaptation-a-photo-exhibition-on-mediterranean-transformation-to-address-climate-adaptation/?(?:[?#].*)?$'
          - '^https?://nbracer[.]eu/voices-of-the-youth-2/?(?:[?#].*)?$'
          - '^https?://wptemplate[.]impacthub[.]net/impact-stories/?(?:[?#].*)?$'
          # A known corrupt copy of a supporting attachment is not a call-detail page.
          - '^https?://assets[.]eitfood[.]eu/files/OPEN-CALLS/Declaration-on-AI-template_Attachment-to-Lower-Silesia-360%C2%B0-Integrated-Farm-Advisory-Implementation-Copy[.]docx(?:[?#].*)?$'
          # These EIT-wide links are dated 2021 archive entries, not current opportunities.
          - '^https?://(?:www[.])?eit[.]europa[.]eu/our-activities/opportunities/(?:raw-materials-and-circular-societies-prize-call-2021|eit-food-government-executive-academy-2021|eit-food-ris-fellowships-2021|eit-hub-israel-calling2scale-bootcamp|call-applications-eit-ris-joint-innovation-incubator-programme|eit-urban-mobility-start-investment-2021|eit-health-innostars-awards-applications-open|eit-rawmaterials-start-accelerator-apply-now|eit-food-open-call-grow-workshops)(?:/|[?#]|$)'
          - '^https?://ec[.]europa[.]eu/eusurvey/runner/EIC_WLP4_Application_Form(?:[?#].*)?$'
          # Standalone budget templates are supporting documents, not call-detail pages.
          - '^https?://eit-hei[.]eu/wp-content/uploads/2026/10/EIT-HEI-Call-2026-Project-Budget-Template[.]xlsx(?:[?#].*)?$'
          - '^https?://neb[.]eitcommunity[.]eu/wp-content/uploads/2026/07/Co_create_Budget[.]xlsx(?:[?#].*)?$'
          - '^https?://(?:www[.])?eiturbanmobility[.]eu/wp-content/uploads/2021/07/Budget-template_branded[.]xlsx(?:[?#].*)?$'
          # EIT taxonomy, historical news, procurement, and expert-account navigation are not funding opportunities.
          - '^https?://(?:www[.])?eit[.]europa[.]eu/tags/opportunity-0(?:/|[?#]|$)'
          - '^https?://(?:www[.])?eit[.]europa[.]eu/news-events/news/european-prize-women-innovators-2026-celebrates-visionary-women(?:/|[?#]|$)'
          - '^https?://(?:www[.])?eit[.]europa[.]eu/opportunities/about-eu-public-procurement(?:/|[?#]|$)'
          - '^https?://(?:www[.])?eit[.]europa[.]eu/sites/default/files/.*(?:contracts|contract).*awarded.*[.]pdf(?:[?#].*)?$'
          - '^https?://(?:www[.])?eit[.]europa[.]eu/our-activities/call-for-eit-communities/2021(?:/|[?#]|$)'
          - '^https?://(?:www[.])?ec[.]europa[.]eu/research/participants/data/ref/h2020/(?:other/)?experts_manual/'
          - '^https?://webgate[.]ec[.]europa[.]eu/funding-tenders-opportunities/display/IT/Duplicate[+]Profile[+]and[+]Account[+]Deletion(?:/|[?#]|$)'
          - '^https?://opencalls[.]fund/open-call/results/[^/?#]+(?:[/?#].*)?$'
          - '^https?://(?:www[.])?eit[.]europa[.]eu/our-activities/opportunities/eit-community-joint-programme-start-future(?:/|[?#]|$)'
          - '^https?://cutt[.]ly/Cnhivhz/?(?:[?#].*)?$'
