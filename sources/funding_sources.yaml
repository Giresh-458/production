sources:
  tier_1:
  - name: Ethereum ESP RFPs
    url: https://esp.ethereum.foundation/applicants/rfp
    focus: current Ethereum requests for proposals, research, security, cryptography,
      protocol, academic and ecosystem infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum ESP Open Rounds
    url: https://esp.ethereum.foundation/applicants/open-rounds
    focus: active Ethereum grant rounds and time-limited funding opportunities
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/open-rounds
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum Road to Devcon 8 India University Program
    url: https://esp.ethereum.foundation/applicants/rfp/rtd8_india_academic
    focus: India universities, faculty, academic engagement, Ethereum research and
      education
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp/rtd8_india_academic
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Chainlink Grants
    url: https://chain.link/community/grants
    direct_page: true
    focus: official Chainlink grant program, oracle tooling, RWA, data feeds, cross-chain and stablecoin infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - chain.link
      discovery:
        start_urls:
        - https://chain.link/community/grants
        max_depth: 2
        max_pages: 6
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Solana Grants and Funding
    url: https://solana.org/grants-funding
    focus: payments, stablecoins, DePIN, high-performance infrastructure, consumer
      apps
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - solana.org
      - solana.com
      - earn.superteam.fun
      discovery:
        start_urls:
        - https://solana.org/grants-funding
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  tier_2:
  - name: NEAR Ecosystem Funding
    url: https://www.near.org/funding
    focus: official NEAR ecosystem grants, protocol rewards, developer tooling, public goods and builder funding; follow only linked grant destinations
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - near.org
      - devhub.near.org
      - docs.metapool.app
      - potlock.org
      discovery:
        start_urls:
        - https://www.near.org/funding
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ripple UBRI
    url: https://ripple.com/impact/ubri/
    focus: university partnership-based blockchain research, digital assets, payments and identity; research/impact PDFs are not funding calls by themselves
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - ripple.com
      discovery:
        start_urls:
        - https://ripple.com/impact/ubri/
        max_depth: 2
        max_pages: 5
        follow_detail_pages: true
        follow_pdfs: false
        pagination: true
  - name: XRPL Grants Program
    url: https://xrplgrants.org/
    focus: official XRPL builder grants, developer tooling, tokenization, stablecoins and payments; validate current round/acceptance dates
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - xrplgrants.org
      discovery:
        start_urls:
        - https://xrplgrants.org/
        max_depth: 2
        max_pages: 6
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Filecoin Grants and Funding
    url: https://github.com/filecoin-project/devgrants
    direct_page: true
    focus: DePIN, decentralized storage, data infrastructure, retrieval, verifiable
      compute
    collection:
      mode: api
      provider: github
      repo: filecoin-project/devgrants
      pagination: true
      detail_fetch: true
      limits:
        max_pages: 5
        max_documents: 250
  tier_3:
  - name: MeitY Startup Hub
    url: https://msh.meity.gov.in/
    focus: official India technology startup schemes and current calls, including GENESIS EIR, early-stage/pilot funding, deep-tech support and incubator-linked programs
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - msh.meity.gov.in
      discovery:
        start_urls:
        - https://msh.meity.gov.in/
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: BIRAC Calls for Proposal
    url: https://www.birac.nic.in/cfp.php
    focus: official biotech and health innovation calls, medical devices, diagnostics, bioinformatics, AI/IoT/automation for health and undergraduate E-YUVA fellowships
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - birac.nic.in
      - www.birac.nic.in
      discovery:
        start_urls:
        - https://www.birac.nic.in/cfp.php
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: iDEX Defence Innovation Challenges
    url: https://www.idex.gov.in/challenges
    focus: official Indian defence/security innovation challenges, robotics, autonomy, sensors, embedded systems, cyber-physical systems and prototype commercialization
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - idex.gov.in
      - www.idex.gov.in
      discovery:
        start_urls:
        - https://www.idex.gov.in/challenges
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: ANRF Research Funding
    url: https://anrfonline.in/ANRF/HomePage
    focus: official India research funding calls in science, engineering, computer engineering, health sciences and mission-mode innovation; retain applicant and host-institution eligibility evidence
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - anrf.gov.in
      - www.anrf.gov.in
      - anrfonline.in
      - www.anrfonline.in
      discovery:
        start_urls:
        - https://anrfonline.in/ANRF/HomePage
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: DST India Calls for Proposals
    url: https://onlinedst.gov.in/
    focus: official India science funding and calls for proposals in research, engineering, cybersecurity and digital systems
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - dst.gov.in
      - www.dst.gov.in
      - onlinedst.gov.in
      discovery:
        start_urls:
        - https://onlinedst.gov.in/
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  cps_funding:
  - name: NSF CPS Foundations and Connected Communities
    url: https://www.nsf.gov/funding/opportunities/cps-cyber-physical-system-foundations-connected-communities
    focus: cyber-physical systems, AI-enabled autonomy, formal methods, safety, security,
      privacy, trustworthiness, IoT, CPS platforms
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - nsf.gov
      - www.nsf.gov
      discovery:
        start_urls:
        - https://www.nsf.gov/funding/opportunities/cps-cyber-physical-system-foundations-connected-communities
        max_depth: 3
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        max_pages: 30
  - name: DARPA Research Opportunities
    url: https://www.darpa.mil/work-with-us/opportunities
    focus: official U.S. defense R&D solicitations, autonomous systems, cyber-physical security, critical infrastructure, robotics and embedded systems; verify foreign-partner eligibility
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - darpa.mil
      - www.darpa.mil
      discovery:
        start_urls:
        - https://www.darpa.mil/work-with-us/opportunities
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: ARPA-E
    url: https://arpa-e-foa.energy.gov/Default.aspx
    focus: smart grid, energy systems, resilient infrastructure, control systems; verify opportunity-specific deadlines and applicant geography
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - arpa-e-foa.energy.gov
      discovery:
        start_urls:
        - https://arpa-e-foa.energy.gov/Default.aspx
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Grants.gov Public Opportunities API
    url: https://api.grants.gov/v1/api/search2
    direct_page: true
    focus: U.S. federal research and technology funding opportunities, open and forecasted
      grants
    collection:
      mode: api
      provider: grants_gov
      pagination: true
      detail_fetch: true
      limits:
        max_pages: 10
        max_documents: 500
