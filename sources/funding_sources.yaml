# Canonical research domains: RWA, ESG, ZK-IoV, DID, DePIN, MEV, and Stablecoins. Each discovered call must independently match source evidence.
sources:
  tier_1:
  - name: Ethereum ESP RFPs
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/rfp
    focus: current Ethereum requests for proposals, research, security, cryptography,
      protocol, academic and ecosystem infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum ESP Open Rounds
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/open-rounds
    focus: active Ethereum grant rounds and time-limited funding opportunities
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/open-rounds
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Solana Grants and Funding
    research_domains: [RWA, DePIN, MEV, Stablecoins]
    url: https://solana.org/grants-funding
    direct_page: false
    focus: payments, stablecoins, DePIN, high-performance infrastructure, consumer
      apps
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - solana.org
      - solana.com
      - airtable.com
      # Crawl the public RFP table and official pages; exclude forms and Superteam's
      # directory below because Superteam is separately configured.
      discovery:
        start_urls:
        - https://solana.org/grants-funding
        max_depth: 3
        max_pages: 30
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://(?:www\.)?share\.hsforms\.com/'
          - '^https?://earn\.superteam\.fun/grants(?:/|\?|$)'
          - '^https?://solana\.com/news/'
  - name: Superteam Development Grants
    research_domains: [RWA, DePIN, MEV, Stablecoins]
    url: https://superteam.fun/earn/opportunities/development-grants/
    focus: Official Superteam Earn development-grants directory for Solana and web3 builders. Treat this as a discovery hub, not proof that every listed opportunity is a current cash grant; verify each listing's status, funding or prize terms, eligibility and application instructions.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - superteam.fun
      - earn.superteam.fun
      - solana.org
      - solana.foundation
      - solana.com
      - airtable.com
      - share.hsforms.com
      - typeform.com
      discovery:
        start_urls:
        - https://superteam.fun/earn/opportunities/development-grants/
        max_depth: 3
        max_pages: 70
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://docs\.google\.com/document/'
          # Direct application forms are links to apply, not separate grant records.
          - '^https?://[^/]*typeform\.com/'
          - '^https?://share\.hsforms\.com/'
          - '^https?://airtable\.com/'
          # Announcement articles are not individual funding calls.
          - '^https?://(?:www\.)?solana\.com/news/'
  tier_2:
  - name: NEAR Ecosystem Funding
    research_domains: [RWA, DID, DePIN, MEV, Stablecoins]
    url: https://near.org/funding
    focus: Official NEAR ecosystem grants; retain individual opportunities only when the call has direct evidence for RWA, DID, DePIN, MEV or stablecoins, with current status verified.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - near.org
      - www.near.org
      - devhub.near.org
      - nearn.io
      - docs.metapool.app
      - potlock.org
      - app.potlock.org
      discovery:
        start_urls:
        - https://near.org/funding
        - https://nearn.io/devhub/
        - https://app.potlock.org/campaigns
        - https://app.potlock.org/pots
        # Explicit portal roots allow shallow traversal to current individual calls.
        max_depth: 3
        # Leave room for current opportunities while excluding non-call social/docs links.
        max_pages: 40
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        # Avoid duplicate rendered Markdown mirrors and irrelevant Meta Pool governance pages.
        exclude_url_patterns:
          - '^https?://(?:www\.)?x\.com/'
          - '^https?://(?:www\.)?linkedin\.com/'
          - '^https?://(?:www\.)?t\.me/'
          - '^https?://github\.com/NEAR-DevHub(?:/|$)'
          - '^https?://docs\.potlock\.io/user-guides/campaigns(?:/|$)'
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/as-validator(?:/|$)'
          - '^https?://docs\.metapool\.app/master/.*\.md(?:[?#].*)?$'
          - '^https?://docs\.metapool\.app/master/tokenomics-and-governance/'
          - '^https?://docs\.metapool\.app/master/meta-pool-ecosystem/vote-governance/(?!grants/?$)'
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/bug-bounty-program(?:/|$)'
          - '^https?://app\.potlock\.org/campaign/\d+\?tab=(?:leaderboard|settings)(?:&|$)'
          - '^https?://app\.potlock\.org/campaign/?(?:\?.*)?$'
  - name: Ripple UBRI
    research_domains: [RWA, DID, Stablecoins]
    url: https://ripple.com/impact/ubri/
    focus: University blockchain research and technical development; assess individual calls for digital assets/RWA, identity, or payment and stablecoin research. Annual research highlights are reports of past activity, not applications; retain only direct call or submission evidence.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - ripple.com
      discovery:
        start_urls:
        - https://ripple.com/impact/ubri/
        max_depth: 2
        max_pages: 5
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
        - '^https?://(?:www\.)?ripple\.com/reports/Ripple-UBRI-Research-20\d{2}\.pdf(?:[?#].*)?$'
        - '^https?://docs\.google\.com/forms/'
  - name: XRPL Grants Program
    research_domains: [RWA, Stablecoins]
    url: https://xrplgrants.org/
    focus: Official XRPL grants directory for RWA/tokenization and stablecoin/payment infrastructure. Crawl the application manager as well as the directory; it can state that no applications are currently open. Require current call-specific evidence before accepting an opportunity.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - xrplgrants.org
      - submit.xrplgrants.org
      - brinc.io
      - tenity.com
      - airtable.com
      discovery:
        start_urls:
        - https://xrplgrants.org/
        - https://submit.xrplgrants.org/submit
        max_depth: 3
        max_pages: 24
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://xrplgrants[.]org/(?:awardees|accelerator|about|faq|judges)'
          - '^https?://airtable\.com/'
          # Investor/news articles are not XRPL funding opportunities.
          - '^https?://(?:www\.)?tenity\.com/(?:keyrock-reaches|tenity-joins|tenity-backs|tenity-invests-in)[^/]*'
          - '^https?://keyrock\.com/keyrock-secures-series-c-funding-from-sc-ventures/'
  - name: Filecoin Grants and Funding
    research_domains: [DePIN]
    url: https://fil.org/grants
    direct_page: false
    focus: Official Filecoin Foundation grants directory plus the detailed Filecoin Open Grants programme README. The directory is a discovery hub; treat the linked/seeded Open Grants README as the direct programme page and do not treat historical applicant issues as separate funding calls.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - raw.githubusercontent.com
      - github.com
      - fil.org
      - www.fil.org
      discovery:
        start_urls:
        - https://fil.org/grants
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        max_depth: 2
        max_pages: 12
        # The root URL is a directory. Only force-record the README with the
        # programme's explicit continuous-application and award evidence.
        direct_page_urls:
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        follow_detail_pages: true
        follow_pdfs: true
        pagination: false
        exclude_url_patterns:
          - '^https?://github\.com/filecoin-project/devgrants/issues(?:/|$)'
  - name: Flashbots MEV Research Grants
    research_domains: [MEV]
    url: https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
    direct_page: true
    focus: Official Flashbots MEV fellowship grants for research proposals on MEV topics; verify current availability, deliverables and applicant requirements from the current page.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - github.com
      - raw.githubusercontent.com
      # The grants.md file can retain historical rolling-application wording.
      # Cross-check the repository's current official status before marking it open.
      status_verification_urls:
      - https://raw.githubusercontent.com/flashbots/mev-research/main/README.md
      discovery:
        start_urls:
        - https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  tier_3:
  - name: Climate KIC Open Calls
    research_domains: [ESG]
    url: https://www.climate-kic.org/get-involved/open-calls/
    focus: Official climate-innovation open-call directory. Some entries are accelerators, expressions of interest, or support programmes rather than grants; retain only individual calls with explicit funding/application evidence and direct ESG relevance.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - climate-kic.org
      - www.climate-kic.org
      - neb.eitcommunity.eu
      - eit-hei.eu
      - womentecheurope.eu
      - cascadefunding.sploro.eu
      - bioeconomygiants.com
      - inonext-project.eu
      - www.inonext-project.eu
      - climatechconnect.eu
      - new-european-bauhaus.europa.eu
      - 6740820.app.netsuite.com
      - seedbook.eitrawmaterials.eu
      - www.jetro.go.jp
      - opencalls.fund
      - www.eitfood.eu
      - climatelaunchpad.org
      - www.circlethemed.com
      - cleancities-accelerator.com
      - pcp-wise.eu
      - www.pathways2resilience.eu
      - www.eiturbanmobility.eu
      - eit.europa.eu
      - ec.europa.eu
      - neb.awardsplatform.com
      - neb-catalyse.awardsplatform.com
      - seedbook-portal.eitrawmaterials.eu
      - www.kcicconsulting.com
      - blackseaclimaccelerator.eu
      - www.impacthub.ro
      - accelerator.bg
      - cdr-accelerator.com
      - www.bgi.pt
      - medclimaccelerator.com
      - sell.amazon.co.uk
      - www.eit-circulareconomy.eu
      - www.cleancities.network
      discovery:
        start_urls:
        - https://www.climate-kic.org/get-involved/open-calls/
        - https://www.climate-kic.org/open-call/enhance-neb-2027-open-call/
        max_depth: 3
        # Official partner call pages are opportunity details. Forms, webinars, and
        # unrelated policy documents remain link evidence, not funding records.
        max_pages: 180
        exclude_url_patterns:
          # The partner home page linked from an older programme entry is not a call.
          - '^https?://innonext-project[.]eu/en/?(?:[?#].*)?$'
          - '^https?://[^/]*typeform\.com/'
          - '^https?://(?:www\.)?tally\.so/'
          - '^https?://(?:www\.)?forms\.office\.com/'
          - '^https?://[^/]*zoom\.us/meeting/register/'
          - '^https?://education\.ec\.europa\.eu/sites/default/files/2025-03/STEM_Education_Strategic_Plan_COM_2025_89_1_EN_0\.pdf(?:[?#].*)?$'
          - '^https?://eur03\.safelinks\.protection\.outlook\.com/'
          - '^https?://bit\.ly/'
          - '^https?://(?:www\.)?lyyti\.fi/reg/'
          - '^https?://events\.conversationstarter\.net/'
          - '^https?://(?:www\.)?forms\.gle/'
          - '^https?://ee\.kobotoolbox\.org/'
          - '^https?://climatekic\.tfaforms\.net/'
          - '^https?://(?:www\.)?ec\.europa\.eu/info/funding-tenders/opportunities/portal/screen/how-to-participate/participant-register'
          - '^https?://(?:www\.)?ec\.europa\.eu/info/funding-tenders/opportunities/docs/.+\.pdf(?:[?#].*)?$'
          # Supporting reference documents are not standalone open calls.
          - '^https?://climatechconnect\.eu/assets/pdf/list-of-eit-labelled-programmes-update\.pdf(?:[?#].*)?$'
          - '^https?://new-european-bauhaus\.europa\.eu/system/files/.*/NEB_Compass_V_4\.pdf(?:[?#].*)?$'
          # The archived 2025 application form is not a current call.
          - '^https?://seedbook\.eitrawmaterials\.eu/AddHeiInitiativeProject\.aspx\?CallId=58006(?:[&#].*)?$'
        follow_detail_pages: true
        follow_pdfs: true
        pagination: false
  - name: NSF SBIR Trusted Identity
    research_domains: [DID]
    url: https://www.sbir.gov/topics/1012406
    direct_page: true
    focus: Official SBIR.gov NSF 26-510 Trusted Identity and Identity Management topic. The listing contains multiple due dates; use the next not-yet-passed date and verify qualifying U.S. small-business eligibility against the linked solicitation.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - sbir.gov
      - www.sbir.gov
      discovery:
        start_urls:
        - https://www.sbir.gov/topics/1012406
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  - name: NSF SBIR Climate Change Adaptation and Mitigation
    research_domains: [ESG]
    url: https://www.sbir.gov/topics/1012419
    direct_page: true
    focus: Official SBIR.gov topic page for NSF 26-510 Climate Change Adaptation, Mitigation and Reversal. Page states open status and rolling proposal deadlines; confirm eligibility and current rules against the linked NSF solicitation. Eligibility is limited to qualifying U.S. small-business concerns.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - sbir.gov
      - www.sbir.gov
      discovery:
        start_urls:
        - https://www.sbir.gov/topics/1012419
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  - name: Open SBIR Funding Topics
    research_domains: [RWA, ESG, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://www.sbir.gov/topics?status=Open
    focus: Broad official SBIR.gov discovery portal for open and forthcoming topics across agencies. This is a discovery hub, not proof every listed opportunity is currently accepting applications; validate each topic's status, next due date, U.S. small-business eligibility and direct RIF-domain evidence. Exclude historical awards, generic application guidance and unrelated community pages.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - sbir.gov
      - www.sbir.gov
      - simpler.grants.gov
      - grants.gov
      - nsf.gov
      discovery:
        start_urls:
        - https://www.sbir.gov/topics?status=Open
        max_depth: 3
        max_pages: 80
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
        - '^https?://(?:www\.)?sbir\.gov/javascript\.void'
        - '^https?://(?:www\.)?sbir\.gov/javascript\.void'
        - '^https?://(?:www\.)?sbir\.gov/awards(?:/|\?|#|$)'
        - '^https?://(?:www\.)?sbir\.gov/apply(?:/|\?|#|$)'
        - '^https?://(?:www\.)?sbir\.gov/community/gafc(?:/|\?|#|$)'
        - '^https?://data\.www\.sbir\.gov/'
        - '^https?://(?:www\.)?grants\.gov/grantors/grantor-help(?:/|\?|#|$)'
        # Generic Grants.gov help/navigation pages are not SBIR topics.
        - '^https?://(?:www\.)?grants\.gov/(?:learn-grants|search-grants|applicants|grantors|system-to-system|forms|support)(?:/|\?|#|$)'
        # NSF administrative, award-management, policy, and general navigation pages
        # are not individual funding opportunities; retain specific opportunity URLs.
        - '^https?://(?:www\.)?nsf\.gov/(?:awards(?:/|$)|bfa/(?:dias|dfm)(?:/|$)|policies/(?:pappg|document|brand|records)(?:/|$)|funding/(?:proposal-budget|senior-personnel-documents|data-management-plan|research-involving-[^/]+|learn(?:/|$)|overview/?$|preparing-proposal/?$|graduate-students/?$|entrepreneurs/?$|early-career-researchers/?$|initiatives(?:/|$))|od/honorary-awards(?:/|$))'
        - '^https?://new\.nsf\.gov/(?:awards(?:/|$)|policies/(?:pappg|document|brand|records)(?:/|$)|funding/(?:proposal-budget|learn(?:/|$)|initiatives(?:/|$)|opportunities/?$))'
        - '^https?://seedfund\.nsf\.gov/(?:resources/awardees(?:/|$)|awardees/history(?:/|$)|assets/files/awardees(?:/|$)|apply(?:/|$)|what-we-fund/?$|requirements/?$|solicitation-proposal/?$)'
        - '^https?://(?:www\.)?youtube\.com/user/GrantsGovUS(?:/|$)'
        - '^https?://(?:www\.)?twitter\.com/grantsdotgov(?:/|$)'
        - '^https?://(?:www\.)?x\.com/grantsdotgov(?:/|$)'
        - '^https?://grantsgovprod\.wordpress\.com(?:/|$)'
  - name: EU Open and Forthcoming Funding Calls
    research_domains: [RWA, ESG, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-proposals?isExactMatch=false&order=DESC&pageNumber=1&pageSize=50&sortBy=startDate&status=31094501%2C31094502
    focus: Official EU Funding & Tenders Portal discovery source. Query the Commission's public Search API for open and forthcoming proposal/cascade-funding call types; validate each call's status, deadline, applicant eligibility, funding terms and direct RIF-domain evidence before selection.
    collection:
      mode: api
      provider: eu_funding_tenders
      api:
        types: ["1", "2", "8"]
        statuses: ["31094501", "31094502"]
        page_size: 50
        search_texts:
        - carbon credit
        - MRV emissions
        - sustainability data
        - decentralized identity
        - physical infrastructure
        detail_fetch_missing_metadata: true
        require_eligibility_evidence: true
        require_domain_match: true
      limits:
        # Five targeted queries get up to fourteen 50-result pages each.
        # A live scan retrieved 556 of 567 expected records because a short page
        # arrived before the reported total; allow bounded continuation pages.
        max_pages: 70
        max_documents: 3500
  cps_funding:
  - name: I-DAPT Hub Cyber-Physical Systems Calls
    research_domains: [ESG, ZK-IoV]
    url: https://idapthub.org/applications/call_for_proposals
    direct_page: true
    focus: Official NM-ICPS Technology Innovation Hub proposal call for data analytics and predictive technology in cyber-physical systems, including road transport, health and energy/environment; validate the current submission process.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - idapthub.org
      - www.idapthub.org
      discovery:
        start_urls:
        - https://idapthub.org/applications/call_for_proposals
        max_depth: 2
        # The last live scan discovered 12 URLs, including downloadable DOCX
        # proposal/call documents. Keep a bounded budget large enough to inspect
        # that observed frontier instead of stopping after the fifth successful fetch.
        max_pages: 20
        follow_detail_pages: true
        follow_pdfs: true
        follow_documents: true
        pagination: true
        # This navigation target is stale (HTTP 404), not an application call.
        exclude_url_patterns:
          - '^https?://idapthub\.org/awards/?$'
          # Historical portfolio of already-selected fellows, not an application call.
          - '^https?://(?:www\.)?idapthub\.org/portfolio/chanakya_fellowships/?(?:[?#].*)?$'
