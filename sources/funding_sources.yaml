# Canonical research domains: RWA, ESG, ZK-IoV, DID, DePIN, MEV, and Stablecoins. Each discovered call must independently match source evidence.
sources:
  tier_1:
  - name: Ethereum ESP RFPs
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/rfp
    focus: current Ethereum requests for proposals, research, security, cryptography,
      protocol, academic and ecosystem infrastructure
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/rfp
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Ethereum ESP Open Rounds
    research_domains: [RWA, ZK-IoV, DID, DePIN, MEV, Stablecoins]
    url: https://esp.ethereum.foundation/applicants/open-rounds
    focus: active Ethereum grant rounds and time-limited funding opportunities
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - esp.ethereum.foundation
      discovery:
        start_urls:
        - https://esp.ethereum.foundation/applicants/open-rounds
        max_depth: 3
        max_pages: 8
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: Chainlink Build Program Status
    research_domains: [RWA, Stablecoins]
    url: https://chain.link/blog/build-program-evolution
    focus: Official Chainlink Build-program status bulletin only, not a direct cash-grant call. The June 26, 2026 announcement says existing Build arrangements are being concluded and the latest Build-related token-reward claims ended July 7, 2026. Do not infer an active grant from general technical support or ecosystem access; require a separately published call with explicit funding terms, eligibility, and application instructions.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - chain.link
      discovery:
        start_urls:
        - https://chain.link/blog/build-program-evolution
        # Monitor the official programme-status announcement only. Do not follow old
        # reward, project, or generic ecosystem links as potential grant opportunities.
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  - name: Solana Grants and Funding
    research_domains: [RWA, DePIN, MEV, Stablecoins]
    url: https://solana.org/grants-funding
    direct_page: true
    focus: payments, stablecoins, DePIN, high-performance infrastructure, consumer
      apps
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - solana.org
      - solana.com
      - earn.superteam.fun
      - superteam.fun
      - airtable.com
      discovery:
        start_urls:
        - https://solana.org/grants-funding
        # The Superteam portal moved to superteam.fun. Prefer its current grant directory
        # over the dead legacy /earn/grants route exposed by older navigation links.
        - https://superteam.fun/earn/opportunities/development-grants/
        max_depth: 3
        max_pages: 20
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://solana\.com/news/'
          - '^https?://earn\.superteam\.fun/earn/grants/?(?:[?#].*)?$'
          - '^https?://superteam\.fun/earn/grants/?(?:[?#].*)?$'
  tier_2:
  - name: NEAR Ecosystem Funding
    research_domains: [RWA, DID, DePIN, MEV, Stablecoins]
    url: https://www.near.org/funding
    focus: Official NEAR ecosystem grants; retain individual opportunities only when the call has direct evidence for RWA, DID, DePIN, MEV or stablecoins, with current status verified.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - near.org
      - devhub.near.org
      - nearn.io
      - docs.metapool.app
      - potlock.org
      - app.potlock.org
      discovery:
        start_urls:
        - https://www.near.org/funding
        - https://nearn.io/devhub/
        - https://app.potlock.org/campaigns
        - https://app.potlock.org/pots
        # Explicit portal roots allow shallow traversal to current individual calls.
        max_depth: 2
        # The previous live run exhausted 20 pages and was marked PARTIAL.
        # URL exclusions and targeted portals should reduce waste before raising this cap.
        max_pages: 20
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        # Avoid duplicate rendered Markdown mirrors and irrelevant Meta Pool governance pages.
        exclude_url_patterns:
          - '^https?://docs\.metapool\.app/master/.*\.md(?:[?#].*)?$'
          - '^https?://docs\.metapool\.app/master/tokenomics-and-governance/'
          - '^https?://docs\.metapool\.app/master/meta-pool-ecosystem/vote-governance/(?!grants/?$)'
          - '^https?://docs\.metapool\.app/master/contribute-to-meta-pool/bug-bounty-program(?:/|$)'
  - name: Ripple UBRI
    research_domains: [RWA, DID, Stablecoins]
    url: https://ripple.com/impact/ubri/
    focus: University blockchain research and technical development; assess individual calls for digital assets/RWA, identity, or payment and stablecoin research.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - ripple.com
      discovery:
        start_urls:
        - https://ripple.com/impact/ubri/
        max_depth: 2
        max_pages: 5
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  - name: XRPL Grants Program
    research_domains: [RWA, Stablecoins]
    url: https://xrplgrants.org/
    focus: XRPL grants for tokenization/RWA and stablecoin/payment infrastructure; verify current round status and application details from programme-level pages.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - xrplgrants.org
      - brinc.io
      - tenity.com
      discovery:
        # Treat the homepage as a directory and verify each linked accelerator on
        # its own official programme page; the homepage banner can be stale.
        start_urls:
        - https://xrplgrants.org/
        - https://brinc.io/xrpl-program
        - https://www.tenity.com/program/sfiip-2026/
        max_depth: 1
        max_pages: 10
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
        exclude_url_patterns:
          - '^https?://xrplgrants[.]org/(?:awardees|accelerator|about|faq|judges)'
  - name: Filecoin Grants and Funding
    research_domains: [DePIN]
    url: https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
    direct_page: true
    focus: Official Filecoin Open Grants programme page; extract the programme-level amount and continuous-application evidence rather than treating each applicant's GitHub issue as a separate funding call.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - github.com
      - raw.githubusercontent.com
      discovery:
        start_urls:
        - https://raw.githubusercontent.com/filecoin-project/devgrants/master/Program%20Resources/Open%20Grants%20README.md
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  - name: Flashbots MEV Research Grants
    research_domains: [MEV]
    url: https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
    direct_page: true
    focus: Official Flashbots MEV fellowship grants for research proposals on MEV topics; verify current availability, deliverables and applicant requirements from the current page.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - github.com
      - raw.githubusercontent.com
      discovery:
        start_urls:
        - https://raw.githubusercontent.com/flashbots/mev-research/main/grants.md
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  tier_3:
  - name: Climate Pitch Climate-Tech Grants
    research_domains: [ESG]
    url: https://climatepitch.org/
    direct_page: true
    focus: Official Climate Pitch climate-tech grant platform for early-stage startups; retain individual opportunities only when their call text matches ESG evidence such as climate adaptation, emissions, carbon, MRV or sustainability, and verify current deadlines.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - climatepitch.org
      discovery:
        start_urls:
        - https://climatepitch.org/
        max_depth: 2
        max_pages: 5
        follow_detail_pages: true
        follow_pdfs: true
        pagination: true
  cps_funding:
  - name: NSF CPS Foundations and Connected Communities
    research_domains: [ZK-IoV]
    url: https://www.nsf.gov/funding/opportunities/future-core-computer-information-science-engineering-future-computing/nsf25-543/solicitation
    focus: Official current NSF 25-543 solicitation containing the Cyber-Physical Systems Foundations and Connected Communities programme track; use this canonical solicitation instead of the programme endpoint that returned HTTP 403 in the last live run.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - nsf.gov
      - www.nsf.gov
      discovery:
        start_urls:
        - https://www.nsf.gov/funding/opportunities/future-core-computer-information-science-engineering-future-computing/nsf25-543/solicitation
        # This official solicitation contains the CPS track in its own body. Stay on
        # that canonical document instead of crawling unrelated Future CoRe tracks.
        max_depth: 0
        max_pages: 1
        follow_detail_pages: false
        follow_pdfs: false
        pagination: false
  - name: I-DAPT Hub Cyber-Physical Systems Calls
    research_domains: [ESG, ZK-IoV]
    url: https://idapthub.org/applications/call_for_proposals
    direct_page: true
    focus: Official NM-ICPS Technology Innovation Hub proposal call for data analytics and predictive technology in cyber-physical systems, including road transport, health and energy/environment; validate the current submission process.
    collection:
      mode: web
      engine: crawl4ai
      allowed_domains:
      - idapthub.org
      - www.idapthub.org
      discovery:
        start_urls:
        - https://idapthub.org/applications/call_for_proposals
        max_depth: 2
        # The last live scan discovered 12 URLs, including downloadable DOCX
        # proposal/call documents. Keep a bounded budget large enough to inspect
        # that observed frontier instead of stopping after the fifth successful fetch.
        max_pages: 20
        follow_detail_pages: true
        follow_pdfs: true
        follow_documents: true
        pagination: true
        # This navigation target is stale (HTTP 404), not an application call.
        exclude_url_patterns:
          - '^https?://idapthub\.org/awards/?$'
