name: RIF funding and collection quality gates

on:
  push:
    branches:
      - fix/batch1-eu-live-quality-20261016
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "agents/funding_agent.py"
      - "core/funding_selection.py"
      - "run_pipeline.py"
      - "run_full_pipeline.py"
      - "tests/test_funding_selection.py"
      - "tests/test_funding_persistence_identity.py"
      - "tests/test_run_full_pipeline_funding.py"
      - "tests/test_collection_quality_gate.py"
      - "core/schemas.py"
      - "core/structured_sources.py"
      - "sources/funding_sources.yaml"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_multiple_funding_calls.py"
      - "tests/test_funding_rejection.py"
      - "tests/test_funding_status_model.py"
      - "tests/test_gate_statistics.py"
      - "tests/test_gate_statistics_extra.py"
      - "tests/test_source_discovery_duplicates.py"
      - "tests/test_pipeline_multi_call_behavior.py"
      - "tests/test_source_registry_isolation.py"
      - "tests/test_funding_sources_config.py"
      - "tests/test_collection_completeness.py"
      - ".github/workflows/eu-funding-tests.yml"

permissions:
  contents: read

jobs:
  eu-funding-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML APScheduler requests beautifulsoup4 numpy trafilatura==1.12.2 pypdf python-dotenv "crawl4ai>=0.9.4,<1.0" playwright
          python -m playwright install --with-deps chromium

      - name: Run complete deterministic test suite
        run: python -m pytest -q

      - name: Run focused regression suite
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_funding_selection.py tests/test_funding_persistence_identity.py tests/test_run_full_pipeline_funding.py tests/test_collection_quality_gate.py tests/test_pipeline_multi_call_behavior.py tests/test_source_registry_isolation.py tests/test_live_funding_pipeline.py tests/test_multiple_funding_calls.py tests/test_funding_rejection.py tests/test_funding_status_model.py tests/test_eu_funding_tenders_api.py tests/test_collection_completeness.py -q

      - name: Run bounded live Batch 1 EU qualification audit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from agents.funding_agent import load_sources
          from agents.funding_collector import _collect_eu_funding_tenders
          from core.schemas import CollectionResult
          from core.funding_selection import has_substantive_eligibility_evidence

          target = "EU Open and Forthcoming Funding Calls"
          sources = load_sources(Path("sources/funding_sources.yaml"))
          source = next((item for item in sources if item.name == target), None)
          if source is None:
              raise SystemExit(f"Configured EU source not found: {target}")

          result = _collect_eu_funding_tenders(
              source,
              CollectionResult(source_id=source.name, method="api"),
              warnings=[],
              source_limits={"max_pages": 5, "max_documents": 250},
          )
          today = datetime.now(timezone.utc).date()
          qualified = []
          for document, opportunity in result.opportunities:
              if opportunity.status not in {"OPEN_CALL", "UPCOMING_CALL"}:
                  raise SystemExit(f"Noncurrent record emitted as actionable: {opportunity.program_name}")
              if opportunity.deadline and datetime.fromisoformat(opportunity.deadline).date() < today:
                  raise SystemExit(f"Expired record emitted as actionable: {opportunity.program_name}")
              if not has_substantive_eligibility_evidence(opportunity.eligibility):
                  raise SystemExit(
                      f"Opportunity missing substantive applicant eligibility evidence: {opportunity.program_name}"
                  )
              if opportunity.focus_area not in set(source.research_domains or []):
                  raise SystemExit(f"Opportunity lacks canonical domain match: {opportunity.program_name}")
              qualified.append({
                  "title": opportunity.program_name,
                  "status": opportunity.status,
                  "deadline": opportunity.deadline,
                  "eligibility": opportunity.eligibility[:280],
                  "focus_area": opportunity.focus_area,
                  "url": document.source,
              })

          non_cap_errors = [
              error for error in result.errors
              if not any(marker in str(error.get("error", error)) for marker in (
                  "SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached"
              ))
          ]
          print(json.dumps({
              "records_discovered": result.records_discovered,
              "records_valid": result.records_valid,
              "records_filtered": result.records_filtered,
              "records_filtered_by_reason": result.records_filtered_by_reason,
              "duplicates_removed": result.duplicates_removed,
              "detail_pages_fetched": result.detail_pages_fetched,
              "detail_pages_failed": result.detail_pages_failed,
              "final_status": result.final_status,
              "qualified_samples": qualified[:10],
              "non_cap_errors": non_cap_errors,
          }, indent=2, ensure_ascii=False))
          if not result.records_discovered:
              raise SystemExit("EU API returned no records")
          if result.records_valid == 0:
              raise SystemExit("EU API returned no currently eligible, RIF-domain-matched opportunities in the bounded query set")
          if non_cap_errors:
              raise SystemExit("EU qualification audit had non-limit acquisition/normalization errors")
          PY

      - name: Run full configured Batch 1 scan and strict production selector
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from agents.funding_agent import run_agent
          from core.funding_selection import has_substantive_eligibility_evidence
          from core.schemas import normalize_area
          from run_pipeline import get_all_open_funding_calls

          output_dir = Path("outputs/ci_batch1_full_live")
          output_dir.mkdir(parents=True, exist_ok=True)
          run_id = "ci-batch1-" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%S%fZ")
          response = run_agent(
              "configured_scan",
              None,
              {
                  "sources_path": "sources/funding_sources.yaml",
                  "posts_per_source": 10,
                  "output_dir": str(output_dir / "markdown"),
                  "db_path": str(output_dir / "funding_memory.db"),
                  "analysis_mode": "analyze",
                  "is_test_mode": False,
                  "force_refresh": True,
                  "run_id": run_id,
                  "log_level": "INFO",
              },
          )
          records = response.get("outputs", []) or []
          collection_results = response.get("collection_results", []) or []
          selected, rejected = get_all_open_funding_calls(
              {"outputs": records},
              require_domain_match=True,
          )
          today = datetime.now(timezone.utc).date()
          generic_title = re.compile(
              r"^(?:our programs?|programs?|how to apply|apply|funding|grants?|"
              r"open grants?|grants? and funding|funding opportunities?|open calls?|"
              r"calls? for proposals?|topic|home|overview)$",
              re.IGNORECASE,
          )

          def as_date(value):
              try:
                  return datetime.fromisoformat(str(value).replace("Z", "+00:00")).date() if value else None
              except ValueError:
                  return None

          quality_flags = []
          review_flags = []
          selected_summary = []
          for record in selected:
              title = str(record.get("title") or record.get("program_name") or "").strip()
              status = str(record.get("status") or "").upper()
              deadline = as_date(record.get("deadline"))
              matched_domains = [
                  normalize_area(str(domain))
                  for domain in record.get("matched_rif_domains", []) or []
              ]
              focus_area = normalize_area(str(record.get("focus_area") or ""))
              issues = []
              manual_review = []
              if not record.get("application_url"):
                  manual_review.append("direct_application_url_missing_manual_review")
              research_context = record.get("research_context")
              if not isinstance(research_context, dict):
                  manual_review.append("research_context_missing")
              else:
                  confidence = str(research_context.get("confidence") or "").strip().casefold()
                  if confidence in {"", "unknown", "none", "n/a"}:
                      manual_review.append("research_context_confidence_unknown")
                  challenges = research_context.get("inferred_challenges") or []
                  if not challenges:
                      manual_review.append("research_problem_signal_missing")
              if manual_review:
                  review_flags.append({
                      "title": title,
                      "source_url": record.get("source_url"),
                      "flags": manual_review,
                  })
              if not title or generic_title.fullmatch(title):
                  issues.append("missing_or_generic_title")
              if status != "OPEN_CALL":
                  issues.append("not_currently_open")
              if deadline and deadline < today:
                  issues.append("expired_deadline")
              if not (record.get("source_url") or record.get("application_url")):
                  issues.append("missing_source_or_application_url")
              if not has_substantive_eligibility_evidence(record.get("eligibility")):
                  issues.append("missing_substantive_applicant_eligibility")
              if not matched_domains:
                  issues.append("missing_proven_canonical_domain")
              if matched_domains and focus_area not in matched_domains:
                  issues.append("focus_area_conflicts_with_proven_domain")
              if issues:
                  quality_flags.append({
                      "title": title,
                      "status": status,
                      "deadline": record.get("deadline"),
                      "issues": issues,
                      "source_url": record.get("source_url"),
                  })
              selected_summary.append({
                  "title": title,
                  "status": status,
                  "opening_date": record.get("opening_date"),
                  "deadline": record.get("deadline"),
                  "funding_amount": record.get("funding_amount"),
                  "eligibility": record.get("eligibility"),
                  "application_url": record.get("application_url"),
                  "source_url": record.get("source_url"),
                  "focus_area": record.get("focus_area"),
                  "matched_rif_domains": matched_domains,
                  "selection_score": record.get("selection_score"),
                  "source_status": (record.get("evidence") or {}).get("source_status"),
                  "manual_review_flags": manual_review,
              })

          source_summary = []
          for item in collection_results:
              source_summary.append({
                  key: item.get(key) for key in (
                      "source_id", "method", "final_status", "pages_discovered",
                      "pages_fetched", "pages_failed", "detail_pages_discovered",
                      "detail_pages_fetched", "detail_pages_failed", "documents_discovered",
                      "documents_fetched", "documents_failed", "api_pages_fetched",
                      "api_expected_records", "api_records_received", "records_discovered",
                      "records_valid", "records_failed", "records_filtered",
                      "records_filtered_by_reason", "duplicates_removed", "truncated",
                      "pagination_detected", "pagination_complete", "discovery_exhausted",
                      "max_depth", "max_depth_reached", "urls_skipped",
                      "relevant_urls_skipped", "coverage_gaps", "failed_urls",
                      "evidence_verified", "currentness_verified",
                  )
              })
              source_summary[-1]["coverage_gaps_count"] = len(item.get("coverage_gaps") or [])
              source_summary[-1]["coverage_gaps"] = (item.get("coverage_gaps") or [])[:10]
              source_summary[-1]["failed_urls"] = (item.get("failed_urls") or [])[:10]
              source_summary[-1]["errors"] = [
                  {
                      "operation": error.get("operation") if isinstance(error, dict) else None,
                      "url": error.get("url") if isinstance(error, dict) else None,
                      "error": error.get("error") if isinstance(error, dict) else str(error),
                  }
                  for error in (item.get("errors") or [])
              ][:5]

          rejection_counts = {}
          for candidate in rejected:
              for reason in candidate.get("reasons", []):
                  rejection_counts[reason] = rejection_counts.get(reason, 0) + 1
          summary = {
              "run_status": response.get("status"),
              "run_id": run_id,
              "raw_records_count": len(records),
              "raw_current_status_candidates": sum(
                  str(row.get("status") or "").upper() in {"OPEN_CALL", "UPCOMING_CALL"}
                  for row in records
              ),
              "selected_actionable_count": len(selected),
              "selected_actionable_calls": selected_summary,
              "selected_quality_flags_count": len(quality_flags),
              "selected_quality_flags": quality_flags,
              "selected_manual_review_flags_count": len(review_flags),
              "selected_manual_review_flags": review_flags,
              "rejected_candidates_count": len(rejected),
              "rejection_reason_counts": rejection_counts,
              "source_summary": source_summary,
              "warnings": response.get("warnings", []),
          }
          (output_dir / "records.json").write_text(
              json.dumps(records, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          (output_dir / "selected.json").write_text(
              json.dumps(selected_summary, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          coverage_status_violations = [
              {
                  "source_id": item.get("source_id"),
                  "final_status": item.get("final_status"),
                  "discovery_exhausted": item.get("discovery_exhausted"),
                  "pagination_complete": item.get("pagination_complete"),
                  "coverage_gaps_count": item.get("coverage_gaps_count", 0),
              }
              for item in source_summary
              if (
                  item.get("coverage_gaps_count", 0) > 0
                  and item.get("final_status") in {"NO_ACTIVE_OPPORTUNITIES", "VERIFIED"}
              ) or (
                  item.get("final_status") in {"NO_ACTIVE_OPPORTUNITIES", "VERIFIED"}
                  and (
                      item.get("truncated")
                      or not item.get("discovery_exhausted")
                      or (
                          item.get("pagination_detected")
                          and not item.get("pagination_complete")
                      )
                  )
              )
          ]
          summary["coverage_status_invariant_violations"] = coverage_status_violations
          (output_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          if coverage_status_violations:
              raise SystemExit(
                  "Source status contradicts incomplete discovery/coverage gaps: "
                  + json.dumps(coverage_status_violations, ensure_ascii=False)
              )
          if response.get("status") == "error":
              raise SystemExit("Full configured funding scan returned error status")
          if not records:
              raise SystemExit("Full configured Batch 1 scan discovered no funding records")
          if not selected:
              raise SystemExit("Strict production selector found no eligible, current, domain-matched funding call")
          if quality_flags:
              raise SystemExit("Strict production selector emitted invalid actionable calls")
          PY

      - name: Upload full Batch 1 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-full-live-audit
          path: outputs/ci_batch1_full_live/
          if-no-files-found: warn
          retention-days: 7
