name: EU funding regression tests

on:
  push:
    branches:
      - ci-verify-eu-metadata
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "core/structured_sources.py"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_funding_sources_config.py"
      - ".github/workflows/eu-funding-tests.yml"

permissions:
  contents: read

jobs:
  eu-funding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests beautifulsoup4 python-dotenv pypdf numpy

      - name: Run EU funding and pipeline regression tests
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_live_funding_pipeline.py tests/test_eu_funding_tenders_api.py -q

      - name: Probe official EU detail-document endpoint
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from core.structured_sources import eu_funding_tenders_paginated_search
          from core.http_client import get_response

          result = eu_funding_tenders_paginated_search(
              page_size=2,
              source_limits={"max_pages": 1, "max_documents": 2},
          )
          endpoint = "https://api.tech.ec.europa.eu/search-api/prod/rest/document/"
          samples = []
          for item in result.get("results", [])[:2]:
              reference = str(item.get("reference") or "").strip()
              sample = {
                  "reference": reference,
                  "search_metadata_fields": sorted((item.get("metadata") or {}).keys())
                  if isinstance(item.get("metadata"), dict) else [],
              }
              if reference:
                  try:
                      response = get_response(
                          endpoint + quote(reference, safe=""),
                          params={"apiKey": "SEDIA"},
                          headers={
                              "Accept": "application/json, text/plain, */*",
                              "Referer": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/",
                              "Origin": "https://ec.europa.eu",
                          },
                          timeout=(8, 20),
                          retries=1,
                      )
                      sample["http_status"] = response.status_code
                      payload = response.json()
                      sample["response_type"] = type(payload).__name__
                      sample["response_keys"] = sorted(payload.keys()) if isinstance(payload, dict) else []
                      detail_metadata = payload.get("metadata", {}) if isinstance(payload, dict) else {}
                      sample["detail_metadata_keys"] = sorted(detail_metadata.keys()) if isinstance(detail_metadata, dict) else []
                      interesting = {}
                      if isinstance(detail_metadata, dict):
                          for key, value in detail_metadata.items():
                              if any(term in key.casefold() for term in (
                                  "eligib", "applicant", "admiss", "condition", "deadline",
                                  "beneficiary", "description", "content", "specific", "requirement"
                              )):
                                  interesting[key] = str(value)[:1400]
                      sample["detail_fields_of_interest"] = interesting
                      sample["response_preview"] = json.dumps(payload, ensure_ascii=False)[:1800]
                  except Exception as exc:
                      sample["detail_error"] = f"{type(exc).__name__}: {exc}"
              samples.append(sample)
          print(json.dumps({"detail_endpoint": samples}, indent=2, ensure_ascii=False))
          PY

      - name: Probe EU deadline sorting and eligibility text
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from core.http_client import post_multipart_json

          endpoint = "https://api.tech.ec.europa.eu/search-api/prod/rest/search"
          query = {"bool": {"must": [
              {"terms": {"type": ["1", "2", "8"]}},
              {"terms": {"status": ["31094501", "31094502"]}},
          ]}}
          fields = {
              "query": (None, json.dumps(query, separators=(",", ":")), "application/json"),
              "languages": (None, json.dumps(["en"]), "application/json"),
              "displayLanguage": (None, "en", "text/plain"),
          }
          headers = {
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/",
              "Origin": "https://ec.europa.eu",
              "User-Agent": "RIF/3.1 (+research-intelligence-pipeline)",
          }
          sorts = {}
          selected = []
          for sort_by in ("deadline", "deadlineDate", "startDate"):
              payload, _ = post_multipart_json(
                  endpoint,
                  params={"apiKey": "SEDIA", "text": "*", "pageNumber": 1,
                          "pageSize": 8, "sortBy": sort_by, "orderBy": "DESC"},
                  fields=fields, headers=headers, timeout=(8, 25), retries=1,
              )
              items = payload.get("results", [])
              sorts[sort_by] = [
                  {
                      "title": ((item.get("metadata") or {}).get("title") or [""])[0],
                      "deadline": ((item.get("metadata") or {}).get("deadlineDate") or [""])[0],
                  }
                  for item in items[:5]
              ]
              if sort_by == "deadline":
                  selected = items[:5]

          def extract_hits(value):
              raw = " ".join(str(x) for x in value) if isinstance(value, list) else str(value or "")
              raw = re.sub(r"(?is)<(script|style)\\b[^>]*>.*?</\\1>", " ", raw)
              raw = re.sub(r"(?i)</(?:p|li|div|h[1-6]|tr|br)\\s*>|<br\\s*/?>", "\\n", raw)
              raw = html.unescape(re.sub(r"(?s)<[^>]+>", " ", raw))
              chunks = [re.sub(r"\\s+", " ", x).strip() for x in raw.splitlines()]
              hits = []
              for chunk in chunks:
                  if re.search(r"(?i)eligib|applicant|who can apply|SME|students enrolled|established in|legal entities|research organisation|research organization", chunk):
                      if chunk and chunk not in hits:
                          hits.append(chunk[:500])
              return hits[:12]

          eligibility = []
          for item in selected:
              metadata = item.get("metadata", {}) if isinstance(item.get("metadata"), dict) else {}
              body = metadata.get("beneficiaryAdministration")
              if body:
                  eligibility.append({
                      "title": ((metadata.get("title") or [""])[0]),
                      "deadline": ((metadata.get("deadlineDate") or [""])[0]),
                      "hits": extract_hits(body),
                  })
          # Probe the Elasticsearch-style range filter: retain active/forthcoming statuses
          # but exclude records whose explicit deadline has elapsed.
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).date().isoformat()
          fresh_query = {"bool": {
              "must": [
                  {"terms": {"type": ["1", "2", "8"]}},
                  {"terms": {"status": ["31094501", "31094502"]}},
              ],
              "must_not": [
                  {"range": {"deadlineDate": {"lt": today}}}
              ],
          }}
          fresh_payload, _ = post_multipart_json(
              endpoint,
              params={"apiKey": "SEDIA", "text": "*", "pageNumber": 1,
                      "pageSize": 10, "sortBy": "deadline", "orderBy": "DESC"},
              fields={
                  "query": (None, json.dumps(fresh_query, separators=(",", ":")), "application/json"),
                  "languages": (None, json.dumps(["en"]), "application/json"),
                  "displayLanguage": (None, "en", "text/plain"),
              },
              headers=headers, timeout=(8, 25), retries=1,
          )
          fresh_items = fresh_payload.get("results", [])
          deadline_filter_probe = {
              "as_of_utc_date": today,
              "total_results": fresh_payload.get("totalResults"),
              "returned": len(fresh_items),
              "records": [
                  {
                      "title": ((item.get("metadata") or {}).get("title") or [""])[0],
                      "deadline": ((item.get("metadata") or {}).get("deadlineDate") or [""])[0],
                      "status": ((item.get("metadata") or {}).get("status") or [""])[0],
                  }
                  for item in fresh_items[:10]
              ],
          }
          print(json.dumps({
              "sort_comparison": sorts,
              "beneficiary_administration_hits": eligibility,
              "deadline_filter_probe": deadline_filter_probe,
          }, indent=2, ensure_ascii=False))
          PY

      - name: Live EU Search API smoke test (bounded)
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from core.structured_sources import eu_funding_tenders_paginated_search
          from core.http_client import fetch_json
          from agents.funding_collector import _eu_metadata_value, _eu_status_to_internal

          result = eu_funding_tenders_paginated_search(
              page_size=10,
              source_limits={"max_pages": 1, "max_documents": 10},
          )
          records = result.get("results", [])
          statuses = Counter()
          eligibility_fields = Counter()
          samples = []

          for item in records:
              metadata = item.get("metadata", {})
              if not isinstance(metadata, dict):
                  metadata = {}
              raw_status = _eu_metadata_value(metadata, "status", "submissionStatus", "callStatus")
              if raw_status is None:
                  raw_status = _eu_metadata_value(item, "status", "submissionStatus", "callStatus")
              statuses[f"{raw_status} -> {_eu_status_to_internal(raw_status) or 'UNMAPPED'}"] += 1

              for key in ("eligibility", "eligibilityConditions", "eligibleApplicants",
                          "applicantEligibility", "admissibilityConditions",
                          "eligibilityCriteria", "topicConditions", "eligibilityCriteriaHtml",
                          "admissibilityCriteria"):
                  if _eu_metadata_value(metadata, key):
                      eligibility_fields[key] += 1

              if len(samples) < 5:
                  samples.append({
                      "title": _eu_metadata_value(metadata, "title", "topicTitle", "callTitle", "name")
                               or _eu_metadata_value(item, "title", "topicTitle", "callTitle", "name"),
                      "status_raw": raw_status,
                      "status_normalized": _eu_status_to_internal(raw_status),
                      "deadline": _eu_metadata_value(metadata, "deadlineDate", "deadline", "deadlineDateTime", "submissionDeadline", "endDate"),
                      "eligibility_field_present": bool(any(
                          _eu_metadata_value(metadata, key) for key in (
                              "eligibility", "eligibilityConditions", "eligibleApplicants",
                              "applicantEligibility", "admissibilityConditions",
                              "eligibilityCriteria", "topicConditions", "eligibilityCriteriaHtml",
                              "admissibilityCriteria"
                          )
                      )),
                      "url": item.get("url"),
                  })

          detail_samples = []
          for item in records[:3]:
              reference = item.get("reference")
              if not reference:
                  continue
              try:
                  detail, detail_url = fetch_json(
                      f"https://api.tech.ec.europa.eu/search-api/prod/rest/document/{reference}",
                      params={"apiKey": "SEDIA"},
                      headers={
                          "Accept": "application/json, text/plain, */*",
                          "Referer": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/",
                          "Origin": "https://ec.europa.eu",
                          "User-Agent": "RIF/3.1 (+research-intelligence-pipeline)",
                      },
                      timeout=(8, 15),
                      retries=1,
                  )
                  detail_metadata = detail.get("metadata", {}) if isinstance(detail, dict) else {}
                  detail_samples.append({
                      "reference": reference,
                      "detail_url": detail_url,
                      "top_level_keys": list(detail.keys()) if isinstance(detail, dict) else [],
                      "metadata_keys": list(detail_metadata.keys()) if isinstance(detail_metadata, dict) else [],
                      "has_eligibility": bool(any(
                          _eu_metadata_value(detail_metadata, key) for key in (
                              "eligibility", "eligibilityConditions", "eligibleApplicants",
                              "applicantEligibility", "admissibilityConditions",
                              "eligibilityCriteria", "topicConditions", "eligibilityCriteriaHtml",
                              "admissibilityCriteria"
                          )
                      )),
                  })
              except Exception as exc:
                  detail_samples.append({"reference": reference, "detail_error": str(exc)})

          output = {
              "records_received": len(records),
              "total_expected": result.get("total_expected"),
              "pages_fetched": result.get("pages_fetched"),
              "pagination_complete": result.get("pagination_complete"),
              "status_mapping_counts": dict(statuses),
              "eligibility_metadata_field_counts": dict(eligibility_fields),
              "detail_endpoint_samples": detail_samples,
              "sample_records": samples,
              "errors": result.get("errors", []),
          }
          print(json.dumps(output, indent=2, ensure_ascii=False))

          non_cap_errors = [
              error for error in result.get("errors", [])
              if not any(marker in error for marker in (
                  "SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached"
              ))
          ]
          if not records or non_cap_errors:
              raise SystemExit(1)
          PY
