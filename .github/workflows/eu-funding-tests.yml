name: RIF funding and collection quality gates

on:
  push:
    branches:
      - fix/batch1-eu-live-quality-20261016
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "tests/test_eu_query_budget.py"
      - "agents/funding_agent.py"
      - "core/crawl4ai_web.py"
      - "core/funding_selection.py"
      - "core/problem_extraction.py"
      - "tests/test_funding_output_quality.py"
      - "run_pipeline.py"
      - "run_full_pipeline.py"
      - "tests/test_funding_selection.py"
      - "tests/test_funding_persistence_identity.py"
      - "tests/test_run_full_pipeline_funding.py"
      - "tests/test_collection_quality_gate.py"
      - "core/schemas.py"
      - "core/structured_sources.py"
      - "sources/funding_sources.yaml"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_multiple_funding_calls.py"
      - "tests/test_funding_rejection.py"
      - "tests/test_funding_status_model.py"
      - "tests/test_funding_call_separation.py"
      - "tests/test_gate_statistics.py"
      - "tests/test_gate_statistics_extra.py"
      - "tests/test_source_discovery_duplicates.py"
      - "tests/test_pipeline_multi_call_behavior.py"
      - "tests/test_source_registry_isolation.py"
      - "tests/test_funding_sources_config.py"
      - "tests/test_collection_completeness.py"
      - "tests/test_crawler_limits.py"
      - "tests/test_funding_quality.py"
      - "scripts/pipeline_tools/audit_batch1_live.py"
      - "tests/test_xrpl_application_manager.py"
      - "core/funding_quality.py"
      - "core/mission_gate.py"
      - "core/recursive_collection.py"
      - "tests/test_research_mission_grounding.py"
      - "tests/test_regulation_source_scoping.py"
      - ".github/workflows/eu-funding-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eu-funding-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML APScheduler requests beautifulsoup4 numpy trafilatura==1.12.2 pypdf python-dotenv "crawl4ai>=0.9.4,<1.0" playwright
          python -m pip install ruff
          python -m playwright install --with-deps chromium

      - name: Check live audit for undefined names
        run: ruff check --select F821 scripts/pipeline_tools/audit_batch1_live.py

      - name: Run complete deterministic test suite
        run: python -m pytest -q

      - name: Run EU query-budget regressions
        run: python -m pytest tests/test_eu_query_budget.py -q

      - name: Run focused regression suite
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_funding_selection.py tests/test_funding_persistence_identity.py tests/test_run_full_pipeline_funding.py tests/test_collection_quality_gate.py tests/test_pipeline_multi_call_behavior.py tests/test_source_registry_isolation.py tests/test_live_funding_pipeline.py tests/test_multiple_funding_calls.py tests/test_funding_rejection.py tests/test_funding_status_model.py tests/test_eu_funding_tenders_api.py tests/test_collection_completeness.py tests/test_funding_quality.py tests/test_crawler_limits.py tests/test_funding_output_quality.py -q

      - name: Run bounded live Batch 1 EU qualification audit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from agents.funding_agent import load_sources
          from agents.funding_collector import _collect_eu_funding_tenders
          from core.schemas import CollectionResult
          from core.funding_selection import has_substantive_eligibility_evidence
          from core.batch2 import validate_batch1_context

          target = "EU Open and Forthcoming Funding Calls"
          sources = load_sources(Path("sources/funding_sources.yaml"))
          source = next((item for item in sources if item.name == target), None)
          if source is None:
              raise SystemExit(f"Configured EU source not found: {target}")

          result = _collect_eu_funding_tenders(
              source,
              CollectionResult(source_id=source.name, method="api"),
              warnings=[],
              # The collector treats max_pages as a global query-page budget.
              # Ten pages check one page for each of the ten configured search terms;
              # the 250-document cap keeps this qualification check bounded.
              source_limits={"max_pages": 10, "max_documents": 250},
          )
          today = datetime.now(timezone.utc).date()
          qualified = []
          for document, opportunity in result.opportunities:
              if opportunity.status not in {"OPEN_CALL", "UPCOMING_CALL"}:
                  raise SystemExit(f"Noncurrent record emitted as actionable: {opportunity.program_name}")
              if opportunity.deadline and datetime.fromisoformat(opportunity.deadline).date() < today:
                  raise SystemExit(f"Expired record emitted as actionable: {opportunity.program_name}")
              if not has_substantive_eligibility_evidence(opportunity.eligibility):
                  raise SystemExit(
                      f"Opportunity missing substantive applicant eligibility evidence: {opportunity.program_name}"
                  )
              if opportunity.focus_area not in set(source.research_domains or []):
                  raise SystemExit(f"Opportunity lacks canonical domain match: {opportunity.program_name}")
              qualified.append({
                  "title": opportunity.program_name,
                  "status": opportunity.status,
                  "deadline": opportunity.deadline,
                  "eligibility": opportunity.eligibility[:280],
                  "focus_area": opportunity.focus_area,
                  "url": document.source,
              })

          cap_markers = ("SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached")
          detail_fetch_warnings = [
              error for error in result.errors
              if isinstance(error, dict)
              and error.get("operation") == "fetch_detail_metadata"
              and not any(marker in str(error.get("error", error)) for marker in cap_markers)
          ]
          # A failed detail lookup only excludes that candidate when its eligibility
          # cannot be established. It must remain visible in the audit, but should not
          # invalidate other independently qualified records. Search/API acquisition
          # failures still block this check; records_valid == 0 is checked below.
          non_cap_errors = [
              error for error in result.errors
              if not (
                  isinstance(error, dict)
                  and error.get("operation") == "fetch_detail_metadata"
              )
              and not any(marker in str(error.get("error", error)) for marker in cap_markers)
          ]
          audit = {
              "records_discovered": result.records_discovered,
              "records_valid": result.records_valid,
              "records_filtered": result.records_filtered,
              "records_filtered_by_reason": result.records_filtered_by_reason,
              "duplicates_removed": result.duplicates_removed,
              "detail_pages_fetched": result.detail_pages_fetched,
              "detail_pages_failed": result.detail_pages_failed,
              "final_status": result.final_status,
              "qualified_samples": qualified[:10],
              "detail_fetch_warnings": detail_fetch_warnings,
              "non_cap_errors": non_cap_errors,
          }
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          # Preserve the bounded qualification evidence even when it finds no
          # eligible call in its deliberately shallow sample. The strict full
          # configured scan below is the acceptance decision; a bounded sample
          # with zero qualified records is not, by itself, proof the source is empty.
          audit_dir = Path("outputs/ci_batch1_full_live")
          audit_dir.mkdir(parents=True, exist_ok=True)
          (audit_dir / "preflight_eu_qualification.json").write_text(
              json.dumps(audit, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          if not result.records_discovered:
              raise SystemExit("EU API returned no records")
          if non_cap_errors:
              raise SystemExit("EU qualification audit had non-limit acquisition/normalization errors")
          PY

      - name: Run full configured Batch 1 scan and strict production selector
        id: batch1_full_scan
        run: |
          python scripts/pipeline_tools/audit_batch1_live.py

      - name: Run required bounded live Batch 2 smoke from individually validated Batch 1 contexts
        id: batch2_live_smoke
        # Exercise independent Batch-2 even if an unrelated Batch-1 source blocks
        # global acceptance. The full pipeline's global Batch-1 gate is unchanged.
        if: always() && steps.batch1_full_scan.outputs.context_handoff_ready == 'true'
        timeout-minutes: 15
        continue-on-error: true
        run: |
          python scripts/pipeline_tools/run_batch2.py \
            --funding-context-file outputs/ci_batch1_full_live/funding_contexts.json \
            --profile smoke \
            --execution-mode parallel \
            --max-workers 6 \
            --output-root outputs/ci_batch1_full_live/batch2_live_smoke

      - name: Verify persisted Batch 2 smoke contract
        if: always() && steps.batch1_full_scan.outputs.context_handoff_ready == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from core.batch2 import DOWNSTREAM_FUNDING_CONTEXT_AGENTS

          root = Path("outputs/ci_batch1_full_live/batch2_live_smoke")
          reports = sorted(root.glob("*/workflow/batch2_report.json"))
          if len(reports) != 1:
              raise SystemExit(
                  f"Expected exactly one Batch-2 report, found {len(reports)}: "
                  + ", ".join(str(path) for path in reports)
              )

          report_path = reports[0]
          report = json.loads(report_path.read_text(encoding="utf-8"))
          run_root = report_path.parents[1]
          expected_agents = sorted(DOWNSTREAM_FUNDING_CONTEXT_AGENTS)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(report.get("batch3_started") is False, "Batch-3 must remain unstarted")
          require(report.get("run_id") == run_root.name, "Batch-2 report run_id does not match its output directory")

          calls = report.get("funding_calls") or []
          call_statuses = {call.get("status") for call in calls}
          ready_calls = [call for call in calls if call.get("status") == "ready_for_batch3"]
          no_evidence_calls = [call for call in calls if call.get("status") == "no_relevant_evidence"]
          valid_no_evidence_stop = (
              report.get("status") == "incomplete_no_handoff"
              and bool(calls)
              and call_statuses.issubset({"ready_for_batch3", "no_relevant_evidence"})
              and bool(no_evidence_calls)
          )
          require(
              report.get("status") == "ready_for_batch3" or valid_no_evidence_stop,
              f"Batch-2 reached an invalid outcome: {report.get('status')} / {sorted(str(value) for value in call_statuses)}",
          )

          health = report.get("collector_health") or {}
          require(health.get("scheduled_agents") == expected_agents, "Batch-2 did not schedule exactly the 11 expected collectors")
          require(health.get("total_agents") == 11, "Batch-2 expected collector count is not 11")
          require(health.get("healthy_agents", 0) >= health.get("required_healthy_agents", 1), "Batch-2 healthy collector threshold was not met")

          audit = report.get("collector_artifact_audit") or {}
          require(audit.get("status") == "passed", "Persisted collector artifact audit did not pass")
          require(audit.get("expected_agents") == expected_agents, "Artifact audit expected-agent set does not match the 11 collectors")
          for field in ("missing_task_agents", "duplicate_task_agents", "malformed_task_entries", "unexpected_task_agents", "quarantined_artifacts", "quarantine_failures", "manifest_issues", "issues"):
              require(not audit.get(field), f"Artifact audit has non-empty {field}: {audit.get(field)}")

          collection = report.get("collection") or {}
          stats = collection.get("stats") or {}
          require(stats.get("planned_tasks") == 11, "Batch-2 did not plan all 11 collection tasks")
          tasks = collection.get("tasks") or []
          require(len(tasks) == 11 and {task.get("agent_name") for task in tasks} == set(expected_agents), "Collection task manifest does not contain exactly the 11 expected agents")
          for task in tasks:
              require(task.get("outputs_count", 0) == task.get("persisted_artifact_count", 0), f"{task.get('agent_name')} output count was not reconciled to persisted artifacts")
              require(not task.get("artifact_audit_issues"), f"{task.get('agent_name')} has artifact audit issues")

          require(bool(calls), "Batch-2 produced no per-call normalization result")
          total_records = 0
          total_skipped = 0
          for call in calls:
              call_id = call.get("funding_call_id")
              require(call.get("status") in {"ready_for_batch3", "no_relevant_evidence"}, f"Funding call {call_id} has an invalid status: {call.get('status')}")
              require(not call.get("normalization_errors"), f"Funding call {call_id} has normalization errors")
              require(not call.get("handoff_errors"), f"Funding call {call_id} has normalized handoff errors")
              require(not call.get("evidence_ledger_errors"), f"Funding call {call_id} has evidence-ledger errors")

              paths = call.get("normalized_paths") or {}
              records_path = Path(paths.get("records", ""))
              manifest_path = Path(call.get("input_manifest", ""))
              ledger_path = Path(call.get("evidence_ledger", ""))
              for path in (records_path, manifest_path, ledger_path):
                  require(path.is_file() and path.resolve().is_relative_to(run_root.resolve()), f"Missing or out-of-run normalized output: {path}")

              records = json.loads(records_path.read_text(encoding="utf-8"))
              require(len(records) == call.get("normalized_records"), f"Normalized record count mismatch for {call_id}")
              gate = call.get("mission_relevance_gate") or {}
              if call.get("status") == "ready_for_batch3":
                  require(bool(records), f"Ready funding call {call_id} has no normalized records")
                  for record in records:
                      require(record.get("run_id") == report.get("run_id"), f"Stale run_id in normalized record {record.get('record_id')}")
                      require(record.get("funding_call_ids") == [call_id], f"Cross-call or missing attribution in normalized record {record.get('record_id')}")
                      require(call_id in (record.get("source_funding_call_ids") or []), f"Original attribution trace missing in normalized record {record.get('record_id')}")
                      require(record.get("normalization_status") == "NORMALIZED", f"Non-normalized record reached handoff: {record.get('record_id')}")
              else:
                  require(not records, f"No-relevant-evidence call {call_id} unexpectedly emitted normalized records")
                  require(gate.get("input_records", 0) > 0, f"No-relevant-evidence call {call_id} had no normalization inputs")
                  require(gate.get("accepted_records") == 0, f"No-relevant-evidence call {call_id} accepted records")
                  require(gate.get("rejected_records") == gate.get("input_records"), f"No-relevant-evidence call {call_id} did not account for every input")
                  require(len(gate.get("details") or []) == gate.get("rejected_records"), f"No-relevant-evidence call {call_id} did not record every rejection decision")
              total_records += len(records)

              skipped = call.get("skipped_artifacts") or []
              require(len(skipped) == call.get("skipped_artifact_count"), f"Skipped artifact count mismatch for {call_id}")
              for item in skipped:
                  skipped_path = Path(item.get("path", ""))
                  require(bool(item.get("reason")), f"Skipped artifact has no recorded reason: {item}")
                  require(skipped_path.is_file() and skipped_path.resolve().is_relative_to(run_root.resolve()), f"Skipped evidence was not preserved inside this run: {skipped_path}")
              total_skipped += len(skipped)

          if ready_calls:
              require(total_records > 0, "Ready Batch-2 smoke produced no normalized records")
          else:
              require(bool(no_evidence_calls) and total_records == 0, "Batch-2 did not produce a valid no-evidence stop")
          outcome = (
              "ready for Batch-3"
              if ready_calls and not no_evidence_calls
              else "safely stopped: no relevant evidence for at least one selected call"
          )
          summary = (
              f"## Batch-2 live smoke completed: {outcome}\\n"
              f"- Run: `{report.get('run_id')}`\\n"
              f"- Collectors healthy: {health.get('healthy_agents')}/11 "
              f"(required {health.get('required_healthy_agents')})\\n"
              f"- Persisted artifacts: {stats.get('total_outputs')}\\n"
              f"- Task errors/timeouts (reported, subject to the 6-of-11 health gate): {stats.get('error_tasks')}/{stats.get('timed_out_tasks')}\\n"
              f"- Artifact audit: passed; zero quarantines or manifest issues\\n"
              f"- Calls ready for Batch-3: {len(ready_calls)}; calls stopped for no relevant evidence: {len(no_evidence_calls)}\\n"
              f"- Normalized records: {total_records}\\n"
              f"- Explicitly accounted/preserved skipped artifacts: {total_skipped}\\n"
              f"- Batch-3 started: false\\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Upload full Batch 1 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-full-live-audit
          path: outputs/ci_batch1_full_live/
          if-no-files-found: warn
          retention-days: 7
