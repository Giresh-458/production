name: EU funding regression tests

on:
  push:
    branches:
      - ci-verify-eu-metadata
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "core/structured_sources.py"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_funding_sources_config.py"
      - ".github/workflows/eu-funding-tests.yml"

permissions:
  contents: read

jobs:
  eu-funding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests beautifulsoup4 python-dotenv pypdf numpy

      - name: Run EU funding and pipeline regression tests
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_live_funding_pipeline.py tests/test_eu_funding_tenders_api.py -q

      - name: Probe official EU detail-document endpoint
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from core.structured_sources import eu_funding_tenders_paginated_search
          from core.http_client import get_response

          result = eu_funding_tenders_paginated_search(
              page_size=2,
              source_limits={"max_pages": 1, "max_documents": 2},
          )
          endpoint = "https://api.tech.ec.europa.eu/search-api/prod/rest/document/"
          samples = []
          for item in result.get("results", [])[:2]:
              reference = str(item.get("reference") or "").strip()
              sample = {
                  "reference": reference,
                  "search_metadata_fields": sorted((item.get("metadata") or {}).keys())
                  if isinstance(item.get("metadata"), dict) else [],
              }
              if reference:
                  try:
                      response = get_response(
                          endpoint + quote(reference, safe=""),
                          params={"apiKey": "SEDIA"},
                          headers={
                              "Accept": "application/json, text/plain, */*",
                              "Referer": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/",
                              "Origin": "https://ec.europa.eu",
                          },
                          timeout=(8, 20),
                          retries=1,
                      )
                      sample["http_status"] = response.status_code
                      payload = response.json()
                      sample["response_type"] = type(payload).__name__
                      sample["response_keys"] = sorted(payload.keys()) if isinstance(payload, dict) else []
                      sample["response_preview"] = json.dumps(payload, ensure_ascii=False)[:1800]
                  except Exception as exc:
                      sample["detail_error"] = f"{type(exc).__name__}: {exc}"
              samples.append(sample)
          print(json.dumps({"detail_endpoint": samples}, indent=2, ensure_ascii=False))
          PY

      - name: Live EU Search API smoke test (bounded)
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from core.structured_sources import eu_funding_tenders_paginated_search
          from agents.funding_collector import _eu_metadata_value, _eu_status_to_internal

          result = eu_funding_tenders_paginated_search(
              page_size=10,
              source_limits={"max_pages": 1, "max_documents": 10},
          )
          records = result.get("results", [])
          statuses = Counter()
          eligibility_fields = Counter()
          samples = []

          for item in records:
              metadata = item.get("metadata", {})
              if not isinstance(metadata, dict):
                  metadata = {}
              raw_status = _eu_metadata_value(metadata, "status", "submissionStatus", "callStatus")
              if raw_status is None:
                  raw_status = _eu_metadata_value(item, "status", "submissionStatus", "callStatus")
              statuses[f"{raw_status} -> {_eu_status_to_internal(raw_status) or 'UNMAPPED'}"] += 1

              for key in ("eligibility", "eligibilityConditions", "eligibleApplicants",
                          "applicantEligibility", "admissibilityConditions",
                          "eligibilityCriteria", "topicConditions", "eligibilityCriteriaHtml",
                          "admissibilityCriteria"):
                  if _eu_metadata_value(metadata, key):
                      eligibility_fields[key] += 1

              if len(samples) < 5:
                  samples.append({
                      "title": _eu_metadata_value(metadata, "title", "topicTitle", "callTitle", "name")
                               or _eu_metadata_value(item, "title", "topicTitle", "callTitle", "name"),
                      "status_raw": raw_status,
                      "status_normalized": _eu_status_to_internal(raw_status),
                      "deadline": _eu_metadata_value(metadata, "deadlineDate", "deadline", "deadlineDateTime", "submissionDeadline", "endDate"),
                      "eligibility_field_present": bool(any(
                          _eu_metadata_value(metadata, key) for key in (
                              "eligibility", "eligibilityConditions", "eligibleApplicants",
                              "applicantEligibility", "admissibilityConditions",
                              "eligibilityCriteria", "topicConditions", "eligibilityCriteriaHtml",
                              "admissibilityCriteria"
                          )
                      )),
                      "url": item.get("url"),
                  })

          output = {
              "records_received": len(records),
              "total_expected": result.get("total_expected"),
              "pages_fetched": result.get("pages_fetched"),
              "pagination_complete": result.get("pagination_complete"),
              "status_mapping_counts": dict(statuses),
              "eligibility_metadata_field_counts": dict(eligibility_fields),
              "sample_records": samples,
              "errors": result.get("errors", []),
          }
          print(json.dumps(output, indent=2, ensure_ascii=False))

          non_cap_errors = [
              error for error in result.get("errors", [])
              if not any(marker in error for marker in (
                  "SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached"
              ))
          ]
          if not records or non_cap_errors:
              raise SystemExit(1)
          PY
