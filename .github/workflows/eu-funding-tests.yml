name: RIF funding and collection quality gates

on:
  push:
    branches:
      - fix/batch1-eu-live-quality-20261016
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "tests/test_eu_query_budget.py"
      - "agents/funding_agent.py"
      - "core/crawl4ai_web.py"
      - "core/funding_selection.py"
      - "core/problem_extraction.py"
      - "tests/test_funding_output_quality.py"
      - "run_pipeline.py"
      - "run_full_pipeline.py"
      - "tests/test_funding_selection.py"
      - "tests/test_funding_persistence_identity.py"
      - "tests/test_run_full_pipeline_funding.py"
      - "tests/test_collection_quality_gate.py"
      - "core/schemas.py"
      - "core/structured_sources.py"
      - "sources/funding_sources.yaml"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_multiple_funding_calls.py"
      - "tests/test_funding_rejection.py"
      - "tests/test_funding_status_model.py"
      - "tests/test_funding_call_separation.py"
      - "tests/test_gate_statistics.py"
      - "tests/test_gate_statistics_extra.py"
      - "tests/test_source_discovery_duplicates.py"
      - "tests/test_pipeline_multi_call_behavior.py"
      - "tests/test_source_registry_isolation.py"
      - "tests/test_funding_sources_config.py"
      - "tests/test_collection_completeness.py"
      - "tests/test_crawler_limits.py"
      - "tests/test_funding_quality.py"
      - "scripts/pipeline_tools/audit_batch1_live.py"
      - "tests/test_xrpl_application_manager.py"
      - "core/funding_quality.py"
      - ".github/workflows/eu-funding-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eu-funding-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML APScheduler requests beautifulsoup4 numpy trafilatura==1.12.2 pypdf python-dotenv "crawl4ai>=0.9.4,<1.0" playwright
          python -m pip install ruff
          python -m playwright install --with-deps chromium

      - name: Check live audit for undefined names
        run: ruff check --select F821 scripts/pipeline_tools/audit_batch1_live.py

      - name: Run complete deterministic test suite
        run: python -m pytest -q

      - name: Run EU query-budget regressions
        run: python -m pytest tests/test_eu_query_budget.py -q

      - name: Run focused regression suite
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_funding_selection.py tests/test_funding_persistence_identity.py tests/test_run_full_pipeline_funding.py tests/test_collection_quality_gate.py tests/test_pipeline_multi_call_behavior.py tests/test_source_registry_isolation.py tests/test_live_funding_pipeline.py tests/test_multiple_funding_calls.py tests/test_funding_rejection.py tests/test_funding_status_model.py tests/test_eu_funding_tenders_api.py tests/test_collection_completeness.py tests/test_funding_quality.py tests/test_crawler_limits.py tests/test_funding_output_quality.py -q

      - name: Run bounded live Batch 1 EU qualification audit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from agents.funding_agent import load_sources
          from agents.funding_collector import _collect_eu_funding_tenders
          from core.schemas import CollectionResult
          from core.funding_selection import has_substantive_eligibility_evidence
          from core.batch2 import validate_batch1_context

          target = "EU Open and Forthcoming Funding Calls"
          sources = load_sources(Path("sources/funding_sources.yaml"))
          source = next((item for item in sources if item.name == target), None)
          if source is None:
              raise SystemExit(f"Configured EU source not found: {target}")

          result = _collect_eu_funding_tenders(
              source,
              CollectionResult(source_id=source.name, method="api"),
              warnings=[],
              # The collector treats max_pages as a global query-page budget.
              # Ten pages check one page for each of the ten configured search terms;
              # the 250-document cap keeps this qualification check bounded.
              source_limits={"max_pages": 10, "max_documents": 250},
          )
          today = datetime.now(timezone.utc).date()
          qualified = []
          for document, opportunity in result.opportunities:
              if opportunity.status not in {"OPEN_CALL", "UPCOMING_CALL"}:
                  raise SystemExit(f"Noncurrent record emitted as actionable: {opportunity.program_name}")
              if opportunity.deadline and datetime.fromisoformat(opportunity.deadline).date() < today:
                  raise SystemExit(f"Expired record emitted as actionable: {opportunity.program_name}")
              if not has_substantive_eligibility_evidence(opportunity.eligibility):
                  raise SystemExit(
                      f"Opportunity missing substantive applicant eligibility evidence: {opportunity.program_name}"
                  )
              if opportunity.focus_area not in set(source.research_domains or []):
                  raise SystemExit(f"Opportunity lacks canonical domain match: {opportunity.program_name}")
              qualified.append({
                  "title": opportunity.program_name,
                  "status": opportunity.status,
                  "deadline": opportunity.deadline,
                  "eligibility": opportunity.eligibility[:280],
                  "focus_area": opportunity.focus_area,
                  "url": document.source,
              })

          cap_markers = ("SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached")
          detail_fetch_warnings = [
              error for error in result.errors
              if isinstance(error, dict)
              and error.get("operation") == "fetch_detail_metadata"
              and not any(marker in str(error.get("error", error)) for marker in cap_markers)
          ]
          # A failed detail lookup only excludes that candidate when its eligibility
          # cannot be established. It must remain visible in the audit, but should not
          # invalidate other independently qualified records. Search/API acquisition
          # failures still block this check; records_valid == 0 is checked below.
          non_cap_errors = [
              error for error in result.errors
              if not (
                  isinstance(error, dict)
                  and error.get("operation") == "fetch_detail_metadata"
              )
              and not any(marker in str(error.get("error", error)) for marker in cap_markers)
          ]
          audit = {
              "records_discovered": result.records_discovered,
              "records_valid": result.records_valid,
              "records_filtered": result.records_filtered,
              "records_filtered_by_reason": result.records_filtered_by_reason,
              "duplicates_removed": result.duplicates_removed,
              "detail_pages_fetched": result.detail_pages_fetched,
              "detail_pages_failed": result.detail_pages_failed,
              "final_status": result.final_status,
              "qualified_samples": qualified[:10],
              "detail_fetch_warnings": detail_fetch_warnings,
              "non_cap_errors": non_cap_errors,
          }
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          # Preserve the bounded qualification evidence even when it finds no
          # eligible call in its deliberately shallow sample. The strict full
          # configured scan below is the acceptance decision; a bounded sample
          # with zero qualified records is not, by itself, proof the source is empty.
          audit_dir = Path("outputs/ci_batch1_full_live")
          audit_dir.mkdir(parents=True, exist_ok=True)
          (audit_dir / "preflight_eu_qualification.json").write_text(
              json.dumps(audit, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          if not result.records_discovered:
              raise SystemExit("EU API returned no records")
          if non_cap_errors:
              raise SystemExit("EU qualification audit had non-limit acquisition/normalization errors")
          PY

      - name: Run full configured Batch 1 scan and strict production selector
        id: batch1_full_scan
        run: |
          python scripts/pipeline_tools/audit_batch1_live.py

      - name: Run required bounded live Batch 2 smoke from individually validated Batch 1 contexts
        # Exercise independent Batch-2 even if an unrelated Batch-1 source blocks
        # global acceptance. The full pipeline's global Batch-1 gate is unchanged.
        if: always() && steps.batch1_full_scan.outputs.context_handoff_ready == 'true'
        timeout-minutes: 15
        run: |
          python scripts/pipeline_tools/run_batch2.py \
            --funding-context-file outputs/ci_batch1_full_live/funding_contexts.json \
            --profile smoke \
            --execution-mode parallel \
            --max-workers 6 \
            --output-root outputs/ci_batch1_full_live/batch2_live_smoke

      - name: Upload full Batch 1 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-full-live-audit
          path: outputs/ci_batch1_full_live/
          if-no-files-found: warn
          retention-days: 7
