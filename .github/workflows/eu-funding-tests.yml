name: Batch 1 EU funding quality gate

on:
  push:
    branches:
      - fix/batch1-eu-live-quality-20261016
  pull_request:
    branches:
      - main
    paths:
      - "agents/funding_collector.py"
      - "agents/funding_agent.py"
      - "core/schemas.py"
      - "core/structured_sources.py"
      - "sources/funding_sources.yaml"
      - "tests/test_eu_funding_tenders_api.py"
      - "tests/test_live_funding_pipeline.py"
      - "tests/test_funding_sources_config.py"
      - ".github/workflows/eu-funding-tests.yml"

permissions:
  contents: read

jobs:
  eu-funding-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests beautifulsoup4 python-dotenv pypdf numpy

      - name: Run focused regression suite
        run: |
          python -m pytest tests/test_funding_sources_config.py tests/test_funding_source_registry_hardening.py tests/test_domain_relevance_semantics.py tests/test_funding_domain_filter.py tests/test_funding_call_separation.py tests/test_live_funding_pipeline.py tests/test_eu_funding_tenders_api.py -q

      - name: Diagnose official EU eligibility metadata
        run: |
          python - <<'PY'
          import json
          from core.structured_sources import eu_funding_tenders_paginated_search, eu_funding_tenders_fetch_document
          from agents.funding_collector import _eu_metadata_value, _extract_eu_eligibility_from_html

          result = eu_funding_tenders_paginated_search(
              page_size=50, source_limits={"max_pages": 5, "max_documents": 250}
          )
          samples = []
          for item in result.get("results", []):
              metadata = item.get("metadata", {})
              if not isinstance(metadata, dict):
                  metadata = {}
              title = _eu_metadata_value(metadata, "title", "topicTitle", "callTitle", "name") or ""
              if not any(term in title.casefold() for term in (
                  "one health", "forests and forestry", "perform eu"
              )):
                  continue
              sample = {"title": title, "reference": item.get("reference"), "url": item.get("url")}
              relevant = {}
              for key, value in metadata.items():
                  if any(term in key.casefold() for term in (
                      "eligib", "applicant", "condition", "beneficiar", "admiss", "description",
                      "consortium", "participant", "specific"
                  )):
                      relevant[key] = str(value)[:2200]
              sample["search_fields"] = relevant
              sample["eligibility_parse_from_search"] = {
                  key: _extract_eu_eligibility_from_html(value)
                  for key, value in metadata.items()
                  if any(term in key.casefold() for term in (
                      "eligib", "applicant", "condition", "beneficiar", "admiss"
                  ))
              }
              reference = str(item.get("reference") or "").strip()
              if reference:
                  try:
                      detail = eu_funding_tenders_fetch_document(reference)
                      dm = detail.get("metadata", {}) if isinstance(detail, dict) else {}
                      sample["detail_keys"] = sorted(dm) if isinstance(dm, dict) else []
                      sample["detail_fields"] = {
                          key: str(value)[:2200] for key, value in (dm.items() if isinstance(dm, dict) else [])
                          if any(term in key.casefold() for term in (
                              "eligib", "applicant", "condition", "beneficiar", "admiss",
                              "description", "consortium", "participant", "specific"
                          ))
                      }
                      sample["eligibility_parse_from_detail"] = {
                          key: _extract_eu_eligibility_from_html(value)
                          for key, value in (dm.items() if isinstance(dm, dict) else [])
                          if any(term in key.casefold() for term in (
                              "eligib", "applicant", "condition", "beneficiar", "admiss"
                          ))
                      }
                  except Exception as exc:
                      sample["detail_error"] = str(exc)
              samples.append(sample)
              if len(samples) >= 5:
                  break

          print(json.dumps({"matching_records": samples}, indent=2, ensure_ascii=False))
          if not samples:
              print("No diagnostic sample titles appeared in capped pages; inspect more pages before concluding fields are absent.")
          PY

      - name: Probe EU domain-query discovery
        run: |
          python - <<'PY'
          import json
          from core.http_client import post_multipart_json

          endpoint = "https://api.tech.ec.europa.eu/search-api/prod/rest/search"
          query = {"bool": {"must": [
              {"terms": {"type": ["1", "2", "8"]}},
              {"terms": {"status": ["31094501", "31094502"]}},
          ]}}
          fields = {
              "query": (None, json.dumps(query, separators=(",", ":")), "application/json"),
              "languages": (None, json.dumps(["en"]), "application/json"),
              "displayLanguage": (None, "en", "text/plain"),
          }
          headers = {
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/",
              "Origin": "https://ec.europa.eu",
              "User-Agent": "RIF/3.1 (+research-intelligence-pipeline)",
          }
          terms = [
              "carbon credit", "MRV emissions", "blockchain", "zero knowledge",
              "decentralized identity", "physical infrastructure", "stablecoin",
              "MEV", "climate ESG", "biodiversity", "sustainability data",
          ]
          results = {}
          for term in terms:
              payload, _ = post_multipart_json(
                  endpoint,
                  params={"apiKey": "SEDIA", "text": term, "pageNumber": 1,
                          "pageSize": 10, "sortBy": "deadline", "orderBy": "DESC"},
                  fields=fields, headers=headers, timeout=(8, 20), retries=1,
              )
              hits = payload.get("results", [])
              results[term] = {
                  "total": payload.get("totalResults"),
                  "samples": [
                      {
                          "title": ((item.get("metadata") or {}).get("title") or [""])[0],
                          "deadline": ((item.get("metadata") or {}).get("deadlineDate") or [""])[0],
                      }
                      for item in hits[:3]
                  ],
              }
          print(json.dumps(results, indent=2, ensure_ascii=False))
          PY

      - name: Run bounded live Batch 1 EU qualification audit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from agents.funding_agent import load_sources
          from agents.funding_collector import _collect_eu_funding_tenders
          from core.schemas import CollectionResult

          target = "EU Open and Forthcoming Funding Calls"
          sources = load_sources(Path("sources/funding_sources.yaml"))
          source = next((item for item in sources if item.name == target), None)
          if source is None:
              raise SystemExit(f"Configured EU source not found: {target}")

          result = _collect_eu_funding_tenders(
              source,
              CollectionResult(source_id=source.name, method="api"),
              warnings=[],
              source_limits={"max_pages": 5, "max_documents": 250},
          )
          today = datetime.now(timezone.utc).date()
          qualified = []
          for document, opportunity in result.opportunities:
              if opportunity.status not in {"OPEN_CALL", "UPCOMING_CALL"}:
                  raise SystemExit(f"Noncurrent record emitted as actionable: {opportunity.program_name}")
              if opportunity.deadline and datetime.fromisoformat(opportunity.deadline).date() < today:
                  raise SystemExit(f"Expired record emitted as actionable: {opportunity.program_name}")
              if not opportunity.eligibility:
                  raise SystemExit(f"Opportunity missing eligibility evidence: {opportunity.program_name}")
              if opportunity.focus_area not in set(source.research_domains or []):
                  raise SystemExit(f"Opportunity lacks canonical domain match: {opportunity.program_name}")
              qualified.append({
                  "title": opportunity.program_name,
                  "status": opportunity.status,
                  "deadline": opportunity.deadline,
                  "eligibility": opportunity.eligibility[:280],
                  "focus_area": opportunity.focus_area,
                  "url": document.source,
              })

          non_cap_errors = [
              error for error in result.errors
              if not any(marker in str(error.get("error", error)) for marker in (
                  "SOURCE_LIMIT_REACHED", "TEST_TRUNCATED", "Max pages reached"
              ))
          ]
          print(json.dumps({
              "records_discovered": result.records_discovered,
              "records_valid": result.records_valid,
              "records_filtered": result.records_filtered,
              "records_filtered_by_reason": result.records_filtered_by_reason,
              "duplicates_removed": result.duplicates_removed,
              "detail_pages_fetched": result.detail_pages_fetched,
              "detail_pages_failed": result.detail_pages_failed,
              "final_status": result.final_status,
              "qualified_samples": qualified[:10],
              "non_cap_errors": non_cap_errors,
          }, indent=2, ensure_ascii=False))
          if not result.records_discovered:
              raise SystemExit("EU API returned no records")
          if non_cap_errors:
              raise SystemExit("EU qualification audit had non-limit acquisition/normalization errors")
          PY
