name: RIF normalization and provenance regression tests

on:
  push:
    branches:
      - fix/batch3-normalization-provenance-20261016
      - fix/batch2-scraping-infrastructure
  pull_request:
    branches:
      - main
    paths:
      - "core/agent_interface.py"
      - "core/normalization.py"
      - "core/batch2.py"
      - "scripts/pipeline_tools/run_batch2.py"
      - "tests/test_batch2_runner.py"
      - "tests/test_batch2_live_evidence_regressions.py"
      - "tests/test_batch2_lab_artifact_contract.py"
      - "tests/batch2_test_helpers.py"
      - "docs/BATCH2_COLLECTION_NORMALIZATION.md"
      - "core/intelligence.py"
      - "agents/literature_agent.py"
      - "tests/test_literature_run_provenance.py"
      - "run_pipeline.py"
      - "tests/test_agent_normalization_refresh.py"
      - "tests/test_batch4_normalization.py"
      - "tests/test_funding_normalization_artifact.py"
      - "tests/test_funding_artifact_collision.py"
      - "tests/test_funding_persistence_identity.py"
      - "tests/test_multi_call_evidence_attribution.py"
      - "tests/test_stale_index.py"
      - "tests/test_stale_index_deep.py"
      - "tests/test_stale_index_mutation.py"
      - "tests/test_stale_index_advanced.py"
      - "tests/test_cache_bypass.py"
      - "tests/test_pipeline_multi_call_behavior.py"
      - "tests/test_multiple_funding_calls.py"
      - "tests/test_funding_call_separation.py"
      - "tests/test_funding_routing_golden.py"
      - "tests/test_funding_selection.py"
      - "tests/test_funding_output_quality.py"
      - "tests/test_funding_status_model.py"
      - "tests/test_funding_sources_config.py"
      - "tests/test_funding_domain_filter.py"
      - "tests/test_eu_query_budget.py"
      - "tests/test_collection_quality_gate.py"
      - "tests/test_funding_quality.py"
      - "tests/test_funding_source_registry_hardening.py"
      - "tests/test_pipeline_proposal_gates.py"
      - "tests/test_pipeline_live_guards.py"
      - "tests/test_batch2_orchestration_integrity.py"
      - "tests/test_pipeline_runtime.py"
      - "tests/test_context_propagation.py"
      - "tests/test_funding_context_assignment.py"
      - "tests/test_funding_checkpoint_isolation.py"
      - "tests/test_batch3_verification.py"
      - "tests/test_source_registry_isolation.py"
      - "tests/test_adaptive_area_filtering.py"
      - "tests/test_intelligence_exceptions.py"
      - "tests/test_refresh_mission_gate_preservation.py"
      - ".github/workflows/normalization-provenance-tests.yml"

permissions:
  contents: read

jobs:
  normalization-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML APScheduler requests beautifulsoup4 numpy trafilatura==1.12.2 pypdf python-dotenv "crawl4ai>=0.9.4,<1.0" playwright python-docx

      - name: Run normalization, attribution, and cache regressions
        run: |
          python -m pytest \
            tests/test_agent_normalization_refresh.py \
            tests/test_literature_run_provenance.py \
            tests/test_batch4_normalization.py \
            tests/test_funding_normalization_artifact.py \
            tests/test_funding_artifact_collision.py \
            tests/test_funding_persistence_identity.py \
            tests/test_normalization_atomic_publish.py \
            tests/test_multi_call_evidence_attribution.py \
            tests/test_stale_index.py \
            tests/test_stale_index_deep.py \
            tests/test_stale_index_mutation.py \
            tests/test_stale_index_advanced.py \
            tests/test_cache_bypass.py \
            tests/test_pipeline_multi_call_behavior.py \
            tests/test_multiple_funding_calls.py \
            tests/test_funding_call_separation.py \
            tests/test_funding_routing_golden.py \
            tests/test_funding_selection.py \
            tests/test_funding_output_quality.py \
            tests/test_funding_status_model.py \
            tests/test_funding_sources_config.py \
            tests/test_funding_domain_filter.py \
            tests/test_eu_query_budget.py \
            tests/test_collection_quality_gate.py \
            tests/test_funding_quality.py \
            tests/test_funding_source_registry_hardening.py \
            tests/test_pipeline_proposal_gates.py \
            tests/test_pipeline_live_guards.py \
            tests/test_batch2_orchestration_integrity.py \
            tests/test_pipeline_runtime.py \
            tests/test_context_propagation.py \
            tests/test_funding_context_assignment.py \
            tests/test_funding_checkpoint_isolation.py \
            tests/test_batch3_verification.py \
            tests/test_source_registry_isolation.py \
            tests/test_adaptive_area_filtering.py \
            tests/test_intelligence_exceptions.py \
            tests/test_refresh_mission_gate_preservation.py \
            tests/test_batch2_runner.py \
            tests/test_batch2_live_evidence_regressions.py \
            tests/test_batch2_lab_artifact_contract.py \
            -q
