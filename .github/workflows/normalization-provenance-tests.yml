name: RIF normalization and provenance regression tests

on:
  push:
    branches:
      - fix/batch3-normalization-provenance-20261016
  pull_request:
    branches:
      - main
    paths:
      - "core/agent_interface.py"
      - "core/normalization.py"
      - "core/intelligence.py"
      - "agents/literature_agent.py"
      - "tests/test_literature_run_provenance.py"
      - "run_pipeline.py"
      - "tests/test_agent_normalization_refresh.py"
      - "tests/test_batch4_normalization.py"
      - "tests/test_multi_call_evidence_attribution.py"
      - "tests/test_stale_index.py"
      - "tests/test_stale_index_deep.py"
      - "tests/test_stale_index_mutation.py"
      - "tests/test_stale_index_advanced.py"
      - "tests/test_cache_bypass.py"
      - "tests/test_pipeline_multi_call_behavior.py"
      - "tests/test_batch3_verification.py"
      - "tests/test_source_registry_isolation.py"
      - "tests/test_adaptive_area_filtering.py"
      - "tests/test_intelligence_exceptions.py"
      - "tests/test_refresh_mission_gate_preservation.py"
      - ".github/workflows/normalization-provenance-tests.yml"

permissions:
  contents: read

jobs:
  normalization-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML APScheduler requests beautifulsoup4 numpy trafilatura==1.12.2 pypdf python-dotenv "crawl4ai>=0.9.4,<1.0" playwright

      - name: Run normalization, attribution, and cache regressions
        run: |
          python -m pytest \
            tests/test_agent_normalization_refresh.py \
            tests/test_literature_run_provenance.py \
            tests/test_batch4_normalization.py \
            tests/test_multi_call_evidence_attribution.py \
            tests/test_stale_index.py \
            tests/test_stale_index_deep.py \
            tests/test_stale_index_mutation.py \
            tests/test_stale_index_advanced.py \
            tests/test_cache_bypass.py \
            tests/test_pipeline_multi_call_behavior.py \
            tests/test_batch3_verification.py \
            tests/test_source_registry_isolation.py \
            tests/test_adaptive_area_filtering.py \
            tests/test_intelligence_exceptions.py \
            tests/test_refresh_mission_gate_preservation.py \
            -q
