# RIF UI theme. Users switch System / Light / Dark at the top of the app menu (⋮, top right).
# Docs: docs.streamlit.io/develop/concepts/configuration/theming

[client]
# Hide developer-only toolbar items (Deploy, rerun, clear cache); the theme switch stays.
toolbarMode = "viewer"

[theme]
baseRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fb"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.light.sidebar]
backgroundColor = "#f8fafc"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c31"
textColor = "#e2e8f0"
borderColor = "#24304a"

[theme.dark.sidebar]
backgroundColor = "#0f172a"
